function pickMedia(type){
  // بستن پنل
  document.querySelectorAll('.file-sheet').forEach(el=>el.remove());
  
  const input=document.createElement('input');
  input.type='file';
  
  if(type==='camera-photo'){
    input.accept='image/*';
    input.capture='environment';
  } else if(type==='camera-video'){
    input.accept='video/*';
    input.capture='environment';
  } else if(type==='gallery'){
    input.accept='image/*,video/*';
  } else {
    input.accept='.pdf,.doc,.docx,.txt,.zip,.rar,.xlsx,.pptx';
  }
  
  input.onchange=async(e)=>{
    let file=e.target.files[0];
    if(!file) return;
    
    const isImage=file.type.startsWith('image/');
    const isVideo=file.type.startsWith('video/');
    
    let maxMB=20;
    if(isImage)maxMB=20;
    if(isVideo)maxMB=45;
    
    if(file.size>maxMB*1024*1024){
      showToast('⚠️ حداکثر '+maxMB+' مگابایت');
      return;
    }
    
    showToast('⏳ در حال آماده‌سازی...');
    try{
      if(isImage) file=await compressImage(file,1200,0.75);
      showToast('⏳ در حال ارسال...');
      const reader=new FileReader();
      reader.onload=async(ev)=>{
        try{
          const fields={
            action:'sendChatFile',
            chatId:currentChatId,
            sender:currentUser.name,
            senderNid:currentUser.nationalId,
            role:currentUser.role,
            fileName:file.name,
            mimeType:file.type||'application/octet-stream',
            fileData:ev.target.result
          };
          if(replyContext){
            fields.replyText=replyContext.text.substring(0,80);
            fields.replySender=replyContext.sender;
          }
          const result=await uploadWithProgress(API_URL,fields,file.name,file.size);          if(result&&result.success){
            showToast('✅ ارسال شد');
            cancelReply();
            await loadChatMessages();
          } else {
            showToast('❌ '+((result&&result.message)||'خطا در آپلود'));
          }
                }catch(err){showToast('❌ خطا')}
      };
      reader.onerror=()=>showToast('❌ خطا در خواندن');
      reader.readAsDataURL(file);
    }catch(err){showToast('❌ خطا')}
  };
  input.click();
}

function compressImage(file,maxWidth,quality){
  return new Promise(resolve=>{
    if(!file.type.startsWith('image/')){resolve(file);return}
    if(file.type==='image/gif'){resolve(file);return}
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let {width,height}=img;
        if(width>maxWidth){height=Math.round(height*maxWidth/width);width=maxWidth}
        canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        canvas.toBlob(blob=>{
          if(!blob){resolve(file);return}
          if(blob.size>=file.size){resolve(file);return}
          const newName=file.name.replace(/\.[^.]+$/,'.jpg');
          resolve(new File([blob],newName,{type:'image/jpeg'}));
        },'image/jpeg',quality);
      };
      img.onerror=()=>resolve(file);img.src=e.target.result;
    };
    reader.onerror=()=>resolve(file);reader.readAsDataURL(file);
  });
}

let mediaRecorder=null;
let audioChunks=[];
let recordStartTime=0;
let recordTimer=null;
let isRecording=false;

async function toggleVoiceRecord(){
  if(isRecording){ stopVoiceRecord(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showToast('❌ مرورگر شما ضبط صدا را پشتیبانی نمی‌کند');
    return;
  }
  if(!window.isSecureContext){
    showToast('⚠️ برای ضبط صدا باید سایت با HTTPS باز شود');
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];
    let mimeType='';
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported){
      if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mimeType='audio/webm;codecs=opus';
      else if(MediaRecorder.isTypeSupported('audio/webm'))mimeType='audio/webm';
      else if(MediaRecorder.isTypeSupported('audio/mp4'))mimeType='audio/mp4';
    }
    mediaRecorder=mimeType?new MediaRecorder(stream,{mimeType:mimeType}):new MediaRecorder(stream);
    mediaRecorder.ondataavailable=(e)=>{ if(e.data&&e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
      const dur=Math.round((Date.now()-recordStartTime)/1000);
      await sendVoiceMessage(blob,dur);
    };
    mediaRecorder.start();
    isRecording=true;
    recordStartTime=Date.now();
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micBtn').textContent='⏹';
    document.getElementById('voiceRecBar').classList.add('visible');
    document.getElementById('chatInput').disabled=true;
    let sec=0;
    recordTimer=setInterval(()=>{
      sec++;
      const m=String(Math.floor(sec/60)).padStart(2,'0');
      const s=String(sec%60).padStart(2,'0');
      document.getElementById('voiceTime').textContent=m+':'+s;
      if(sec>=120){ stopVoiceRecord(); showToast('حداکثر ۲ دقیقه'); }
    },1000);
    document.getElementById('voiceTime').textContent='00:00';
  } catch(err){
    console.error(err);
    if(err.name==='NotAllowedError') showToast('❌ دسترسی به میکروفون رد شد');
    else if(err.name==='NotFoundError') showToast('❌ میکروفونی پیدا نشد');
    else showToast('❌ خطا در ضبط صدا');
  }
}

function stopVoiceRecord(){
  if(!isRecording||!mediaRecorder) return;
  isRecording=false;
  clearInterval(recordTimer); recordTimer=null;
  try { mediaRecorder.stop(); } catch(e){}
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micBtn').textContent='🎤';
  document.getElementById('voiceRecBar').classList.remove('visible');
  document.getElementById('chatInput').disabled=false;
}

function cancelVoiceRecord(){
  if(!isRecording||!mediaRecorder) return;
  isRecording=false;
  clearInterval(recordTimer); recordTimer=null;
  audioChunks=[];
  mediaRecorder.onstop=null;
  try { mediaRecorder.stop(); } catch(e){}
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micBtn').textContent='🎤';
  document.getElementById('voiceRecBar').classList.remove('visible');
  document.getElementById('chatInput').disabled=false;
  showToast('لغو شد');
}

async function sendVoiceMessage(blob,duration){
  if(!blob||blob.size===0){ showToast('❌ صدای ضبط شده خالی است'); return; }
  if(blob.size>15*1024*1024){ showToast('⚠️ حجم صدا بیش از ۱۵ مگابایت'); return; }
  const ext=(blob.type.indexOf('mp4')>-1)?'m4a':'webm';
  const now=new Date();
  const fileName='voice_'+now.getTime()+'.'+ext;
  showToast('⏳ ارسال صدا...');
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    try{
            const fields={
        action:'sendChatFile',
        chatId:currentChatId,
        sender:currentUser.name,
        senderNid:currentUser.nationalId,
        role:currentUser.role,
        fileName:fileName,
        mimeType:blob.type||'audio/webm',
        fileData:ev.target.result
      };
      if(replyContext){ fields.replyText=replyContext.text.substring(0,80); fields.replySender=replyContext.sender; }
           const result=await uploadWithProgress(API_URL,fields,fileName,blob.size);

      if(result&&result.success){
        showToast('✅ ارسال شد');
        cancelReply();
        await loadChatMessages();
      } else {
        showToast('❌ '+(result&&result.message||'خطا'));
      }
    } catch(err){ showToast('❌ خطا در ارسال'); }
  };
  reader.onerror=()=>showToast('❌ خطا در خواندن');
  reader.readAsDataURL(blob);
}

    audio.style.display = 'block';

function normalizeTextLocal(s){return String(s||'').trim().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ')}
function normalizeNumbersLocal(s){
  if(s===null||s===undefined)return '';
  var str=String(s).trim();var p='۰۱۲۳۴۵۶۷۸۹',a='٠١٢٣٤٥٦٧٨٩',r='';

function uploadWithProgress(url, fields, fileName, fileSize){
  return new Promise((resolve)=>{
    showUploadOverlay(fileName);
    const iframeName='upload_'+Date.now();
    const iframe=document.createElement('iframe');
    iframe.name=iframeName;
    iframe.style.display='none';
    document.body.appendChild(iframe);
    const form=document.createElement('form');
    form.method='POST';
    form.action=url;
    form.target=iframeName;
    form.style.display='none';
    for(const k in fields){
      const i=document.createElement('input');
      i.type='hidden';
      i.name=k;
      i.value=fields[k];
      form.appendChild(i);
    }
    document.body.appendChild(form);
    
    let done=false;
    let reached90=false;
    const estimatedSec=Math.max(4, fileSize / (500*1024));
    const startT=Date.now();
    
    const animTimer=setInterval(()=>{
      const elapsed=(Date.now()-startT)/1000;
      let pct=Math.min(90, (elapsed/estimatedSec)*90);
      
      if(pct>=90 && !reached90){
        reached90=true;
        // شروع حالت پردازش
      }
      
      document.getElementById('upRingFill').style.strokeDashoffset = String(264 - (264*pct/100));
      document.getElementById('upPercent').textContent = toFa(Math.round(pct))+'٪';
      
      let meta;
      if(reached90){
        // حالت پردازش: نمایش ثانیه‌های سپری‌شده
        const procTime=Math.max(0, Math.round(elapsed-estimatedSec));
        meta = '⏳ در حال پردازش در سرور...';
        if(procTime>3) meta += ' (' + toFa(procTime) + ' ثانیه)';
      } else {
        const loadedKB = Math.round(fileSize * pct / 100 / 1024);
        const totalKB = Math.round(fileSize / 1024);
        if(totalKB>1024){
          meta = toFa((loadedKB/1024).toFixed(1))+' از '+toFa((totalKB/1024).toFixed(1))+' مگابایت';
        } else {
          meta = toFa(loadedKB)+' از '+toFa(totalKB)+' کیلوبایت';
        }
        if(elapsed>2){
          const eta=Math.max(0, Math.round(estimatedSec - elapsed));
          if(eta<60)meta += ' • '+toFa(eta)+' ثانیه مانده';
          else meta += ' • '+toFa(Math.ceil(eta/60))+' دقیقه مانده';
        }
      }
      document.getElementById('upMeta').textContent=meta;
    }, 250);
    
    const cleanup=()=>{
      if(done)return;
      done=true;
      clearInterval(animTimer);
      setTimeout(()=>{
        try{document.body.removeChild(iframe)}catch(e){}
        try{document.body.removeChild(form)}catch(e){}
      },500);
    };
    
    iframe.onload=()=>{
      if(done)return;
      document.getElementById('upRingFill').style.strokeDashoffset='0';
      document.getElementById('upPercent').textContent='۱۰۰٪';
      document.getElementById('upMeta').textContent='✅ تکمیل شد';
      setTimeout(()=>{
        hideUploadOverlay();
        cleanup();
        resolve({success:true});
      }, 700);
    };
    
    form.submit();
    
    // افزایش تایم‌اوت: ۵ دقیقه برای ویدیو، ۳ دقیقه برای بقیه
    const maxTimeout = fileSize > 5*1024*1024 ? 300000 : 180000;
    setTimeout(()=>{
      if(done)return;
      cleanup();
      hideUploadOverlay();
      resolve({success:false, message:'زمان انتظار به پایان رسید'});
    }, maxTimeout);
  });
}

async function loadGradesForClass(){
  const container = document.getElementById('gradeTableContainer');
  const classCode = document.getElementById('gradeClassSelect').value;
  const subject = document.getElementById('gradeSubjectSelect').value;

  if(!subject){
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-title">لطفاً یک درس انتخاب کنید</div></div>';
    return;
  }

  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  try{
    const rClasses = await fetch(API_URL+'?action=getAllClasses&t='+Date.now()).then(r=>r.json());
    const rGrades = await fetch(API_URL+'?action=getGrades&classCode='+encodeURIComponent(classCode)+'&subject='+encodeURIComponent(subject)+'&t='+Date.now()).then(r=>r.json());

    if(!rClasses.success || !rClasses.data){
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطا در دریافت لیست دانش‌آموزان</div><div class="empty-desc">لطفاً دوباره تلاش کنید یا با مدیر تماس بگیرید</div></div>';
      return;
    }

    const classData = rClasses.data[classCode];
    if(!classData){
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">کلاس انتخاب شده پیدا نشد</div><div class="empty-desc">کد کلاس: '+esc(classCode)+'</div></div>';
      return;
    }

    const students = classData.students || [];
    if(students.length === 0){
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">دانش‌آموزی در این کلاس نیست</div></div>';
      return;
    }

    const existingGrades = (rGrades.success && rGrades.data) ? rGrades.data : [];
    const gradeMap = {};
    existingGrades.forEach(g => gradeMap[g.nationalId] = g);

    const months = [
      {key:'m', label:'مهر'}, {key:'aban', label:'آبان'}, {key:'azar', label:'آذر'}, {key:'mid1', label:'میان‌ترم ۱'}, {key:'dey', label:'دی'},
      {key:'bahman', label:'بهمن'}, {key:'esfand', label:'اسفند'}, {key:'farvardin', label:'فروردین'}, {key:'mid2', label:'میان‌ترم ۲'}, {key:'ordibehesht', label:'اردیبهشت'}, {key:'khordad', label:'خرداد'}
    ];

    let html = '<table class="grade-table"><thead><tr><th class="grade-name">نام دانش‌آموز</th>';
    months.forEach(m => html += `<th>${m.label}</th>`);
    html += '</tr></thead><tbody>';

    students.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fa')).forEach(s=>{
      const g = gradeMap[s.nationalId] || {};
      html += `<tr><td class="grade-name">${esc(s.name)}</td>`;
      months.forEach(m=>{
        let val = (g[m.key] !== undefined && g[m.key] !== null) ? g[m.key] : '';
        let inputClass = 'grade-input';
        let displayVal = val;
        if(val === 'غیبت موجه') displayVal = 'م';
        if(val === 'غیبت غیرموجه') { displayVal = 'غ'; inputClass += ' absent'; }
        
        html += `<td><input class="${inputClass}" data-nid="${escAttr(s.nationalId)}" data-key="${m.key}" value="${escAttr(displayVal)}" placeholder="-"></td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;

    container.querySelectorAll('.grade-input').forEach(inp=>{
      inp.addEventListener('input', function(){
        let v = this.value.trim();
        if(v === 'م' || v === 'غ') {
          this.classList.toggle('absent', v === 'غ');
        } else {
          this.classList.remove('absent');
          this.value = this.value.replace(/[^0-9\.]/g, '');
        }
      });
    });

  } catch(e){
    console.error('خطا:', e);
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطای شبکه</div><div class="empty-desc">لطفاً اتصال اینترنت خود را بررسی کنید</div></div>';
  }
}

async function saveTeacherGrades(){
  const classCode = document.getElementById('gradeClassSelect').value;
  const subject = document.getElementById('gradeSubjectSelect').value;
  if(!subject){ showToast('⚠️ نام درس را وارد کنید'); return; }

  const inputs = document.querySelectorAll('.grade-input');
  const recordsMap = {};

  inputs.forEach(inp=>{
    const nid = inp.dataset.nid;
    const key = inp.dataset.key;
    let val = inp.value.trim();
    if(val === 'م') val = 'غیبت موجه';
    else if(val === 'غ') val = 'غیبت غیرموجه';

    if(!recordsMap[nid]) recordsMap[nid] = {};
    recordsMap[nid][key] = val;
  });

  const records = Object.keys(recordsMap).map(nid => {
    return { nationalId: nid, ...recordsMap[nid] };
  });

  showToast('⏳ در حال ذخیره...');
  try{
    const params = new URLSearchParams();
    params.append('action', 'saveGrades');
    params.append('classCode', classCode);
    params.append('subject', subject);
    params.append('teacher', currentUser.name);
    params.append('records', JSON.stringify(records));

    const r = await fetch(API_URL, { method: 'POST', body: params });
    const result = await r.json();
    if(result.success){
      showToast('✅ نمرات با موفقیت ذخیره شد');
    } else {
      showToast('❌ ' + (result.message || 'خطا در ذخیره'));
    }
  }catch(e){
    showToast('❌ خطای شبکه');
  }
}

            if(!sc || sc[key] === undefined || sc[key] === null || sc[key] === '') missing++;
          });
        } else {
          const subGrades = allGrades.filter(g => g.subject === sub);
          students.forEach(st => {
            const sg = subGrades.find(g => g.nationalId === st.nationalId);
            if(!sg || sg[key] === undefined || sg[key] === null || sg[key] === '') missing++;
          });
        }
        
        if(missing > 0) {
          let teachers = expectedSubjects[sub].length > 0 ? expectedSubjects[sub] : ['نامشخص'];
          if (isConduct) teachers = ['معاونت/مدیریت'];
          missingSubjects[sub] = { count: missing, teachers: teachers };
        }
      });
      
      const missingArr = Object.keys(missingSubjects);
      if(missingArr.length > 0) {
        html += '<div style="background:#fff3e0;border-right:4px solid #ef6c00;border-radius:10px;padding:14px;margin-bottom:14px;">';
        html += '<div style="font-size:13px;font-weight:800;color:#e65100;margin-bottom:10px;">⚠️ هشدار: ' + toFa(missingArr.length) + ' درس در ماه ' + mname + ' ناقص است</div>';
        missingArr.forEach(sub => {
          const info = missingSubjects[sub];
          const teacherNames = info.teachers.join('، ');
          html += '<div style="background:#fff;border:1px solid #ffcc80;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;">';
          html += '<span style="font-weight:800;color:#1a2233;">📚 ' + esc(sub) + '</span>';
          html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
          html += '<span style="color:#c62828;font-weight:700;font-size:11px;">👨‍🏫 ' + esc(teacherNames) + '</span>';
          html += '<span style="background:#ffebee;color:#c62828;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;">' + toFa(info.count) + ' نفر ثبت نشده</span>';
          html += '</div></div>';
        });
        html += '</div>';
      } else {
        html += '<div style="background:#e8f5e9;border-right:4px solid #2e7d32;border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;font-weight:700;color:#2e7d32;">✅ همه دروس در ماه ' + mname + ' به طور کامل ثبت شدن</div>';
      }
    } else {
       // پیام خوش‌آمد برای کل سال
       html += '<div style="background:#e3f2fd;border-right:4px solid #0d47a1;border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;font-weight:700;color:#0d47a1;">📄 گزارش کل سال انتخاب شده است. برای مشاهده نقص‌ها، یک ماه خاص را انتخاب کنید.</div>';
    }
    
    // دکمه‌های عملیات
    html += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">';
    html += '<label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer;padding:8px 12px;background:var(--bg);border-radius:8px;">';
    html += '<input type="checkbox" id="selectAllStudents" onchange="toggleAllStudents(this)" style="width:18px;height:18px;accent-color:var(--accent);">';
    html += ' انتخاب همه</label>';
    html += '<button class="submit-btn primary-blue" onclick="printSelectedStudents()" style="flex:1;padding:10px;font-size:12px;">📥 دانلود انتخاب شده‌ها</button>';
    html += '<button class="submit-btn primary-orange" onclick="printAllStudents()" style="flex:1;padding:10px;font-size:12px;">📥 دانلود همه</button>';
    html += '</div>';
    
    // لیست دانش‌آموزان
    html += '<div>';
    students.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fa')).forEach(s => {
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;">';
      html += '<input type="checkbox" class="mgr-student-cb" data-nid="' + escAttr(s.nationalId) + '" onchange="updateSelectAllStatus()" style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer;">';
      html += '<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;">' + esc(String(s.name).charAt(0)) + '</div>';

  const all = document.querySelectorAll('.mgr-student-cb');

async function previewStudentReport(nid, monthIdx) {
  showToast('⏳ در حال آماده‌سازی...');
  try {
    const r = await fetch(API_URL + '?action=getStudentReportData&nationalId=' + encodeURIComponent(nid) + '&t=' + Date.now());
    const res = await r.json();
    if(!res.success) { showToast('❌ ' + (res.message||'خطا')); return; }
    const html = buildReportCardHTML(res.student, res.grades, res.conduct, monthIdx);
    showPrintModal(html);
    showToast('✅ آماده');
  } catch(e) {
    console.error(e);
    showToast('❌ خطا');
  }
}

async function printAllStudents() {
  const classCode = document.getElementById('mgrClassSelect').value;
  const monthIdx = parseInt(document.getElementById('mgrMonthSelect').value);
  try {
    const rClasses = await fetch(API_URL + '?action=getAllClasses&t=' + Date.now()).then(r=>r.json());
    const students = rClasses.data[classCode].students || [];
    const nids = students.map(s => s.nationalId);
    await printMultipleReports(nids, monthIdx);
  } catch(e) {
    showToast('❌ خطا');
  }
}

function printSelectedStudents() {
  const checked = document.querySelectorAll('.mgr-student-cb:checked');
  if(checked.length === 0) { showToast('⚠️ لطفاً حداقل یک دانش‌آموز انتخاب کنید'); return; }
  const monthIdx = parseInt(document.getElementById('mgrMonthSelect').value);
  const nids = Array.from(checked).map(cb => cb.dataset.nid);
  printMultipleReports(nids, monthIdx);
}

async function printMultipleReports(nids, monthIdx) {
  showToast('⏳ در حال آماده‌سازی...');
  let allHtml = '';
  for(const nid of nids) {
    try {
      const r = await fetch(API_URL + '?action=getStudentReportData&nationalId=' + encodeURIComponent(nid) + '&t=' + Date.now());
      const res = await r.json();
      if(res.success) {
        // 🎯 کد قبلی که page-break-after داشت حذف شد. حالا کارنامه‌ها بدون پرش صفحه کنار هم قرار می‌گیرن.
        allHtml += buildReportCardHTML(res.student, res.grades, res.conduct, monthIdx);
      }
    } catch(e) {}
  }
  if(allHtml) showPrintModal(allHtml);
  showToast('✅ آماده');
}

function buildReportCardHTML(student, grades, conduct, monthIdx) {
  const monthsNames = ['مهر','آبان','آذر','میان‌ترم ۱','دی','بهمن','اسفند','فروردین','میان‌ترم ۲','اردیبهشت','خرداد'];
  const monthsKeys = ['m','aban','azar','mid1','dey','bahman','esfand','farvardin','mid2','ordibehesht','khordad'];
  
  let tableHtml = '';
  let sum = 0, cnt = 0;
  
  if (monthIdx === -1) {
     // 🎯 حالت کل سال
     tableHtml = '<table class="rc-table"><thead><tr><th class="sub-name">نام درس</th><th class="teacher-name">نام دبیر</th>';
     monthsNames.forEach(m => tableHtml += '<th>' + m + '</th>');
     tableHtml += '<th>معدل</th></tr></thead><tbody>';
     
     grades.forEach((g, i) => {
        let subSum = 0, subCnt = 0;
        let rowHtml = '<tr class="' + (i%2===0?'row-odd':'row-even') + '"><td class="sub-name">' + esc(g.subject) + '</td><td class="teacher-name">' + esc(g.teacher||'-') + '</td>';
        monthsKeys.forEach(key => {
            const val = g[key];
            let disp = '—', cls = '';
            if(typeof val === 'number') { disp = val; subSum += val; subCnt++; }
            else if(val === 'غیبت موجه') { disp = 'م'; cls = 'abs-excused'; }
            else if(val === 'غیبت غیرموجه') { disp = 'غ'; cls = 'abs-unexcused'; subCnt++; }
            rowHtml += '<td class="' + cls + '">' + esc(disp) + '</td>';
        });
        const subAvg = subCnt > 0 ? (subSum/subCnt) : 0;
        if (subCnt > 0) { sum += subAvg; cnt++; }
        rowHtml += '<td style="font-weight:800">' + (subCnt>0 ? subAvg.toFixed(2) : '—') + '</td></tr>';
        tableHtml += rowHtml;
     });
     
     let cRow = '<tr class="conduct-row"><td class="sub-name">انضباط</td><td class="teacher-name">معاونت</td>';
     monthsKeys.forEach(key => {
         const val = (conduct && conduct[key] !== undefined && conduct[key] !== null) ? conduct[key] : '—';
         cRow += '<td>' + esc(val) + '</td>';
     });
     cRow += '<td>—</td></tr>';
     tableHtml += cRow;
     tableHtml += '</tbody></table>';
  } else {
     // 🎯 حالت یک ماه خاص
     const key = monthsKeys[monthIdx];
     const mname = monthsNames[monthIdx];
     tableHtml = '<table class="rc-table"><thead><tr><th class="sub-name">نام درس</th><th class="teacher-name">نام دبیر</th><th>نمره ' + mname + '</th></tr></thead><tbody>';
     grades.forEach((g, i) => {
        const val = g[key];
        let disp = '—', cls = '';
        if(typeof val === 'number') { disp = val; sum += val; cnt++; }
        else if(val === 'غیبت موجه') { disp = 'غیبت موجه'; cls = 'abs-excused'; }
        else if(val === 'غیبت غیرموجه') { disp = 'غیبت غیرموجه'; cls = 'abs-unexcused'; cnt++; }
        
        tableHtml += '<tr class="' + (i%2===0?'row-odd':'row-even') + '"><td class="sub-name">' + esc(g.subject) + '</td><td class="teacher-name">' + esc(g.teacher||'-') + '</td><td class="' + cls + '" style="font-weight:800">' + esc(disp) + '</td></tr>';
     });
     
     const conductVal = (conduct && conduct[key] !== undefined && conduct[key] !== null) ? conduct[key] : '—';
     tableHtml += '<tr class="conduct-row"><td class="sub-name">انضباط</td><td class="teacher-name">معاونت</td><td style="font-weight:800">' + esc(conductVal) + '</td></tr>';
     tableHtml += '</tbody></table>';
  }
  
  const avg = cnt > 0 ? (sum/cnt).toFixed(2) : '0.00';
  const titleMonth = monthIdx === -1 ? 'سالانه' : monthsNames[monthIdx];
  
  const layout = window._printLayout || '2'; 
  const pageClass = layout === '1' ? 'page-a4' : 'page-a5';
  
  let signatureHtml = '';
  if (layout === '1') {
    signatureHtml = '<div class="rc-signatures"><div>مهر و امضای مدیر</div><div>مهر و امضای معاون</div></div>';
  }
  
  return '<div class="page ' + pageClass + '">' +
    '<div>' +
      '<div class="rc-header"><h2>کارنامه تحصیلی ' + titleMonth + ' دبیرستان شهید پورصابری</h2><p>سال تحصیلی ۱۴۰۶ - ۱۴۰۵</p></div>' +
      '<div class="rc-profile">' +
        '<div class="rc-info">' +
          '<div class="rc-info-item"><span class="rc-info-label">نام:</span><span class="rc-info-value">' + esc(student.name) + '</span></div>' +
          '<div class="rc-info-item"><span class="rc-info-label">کد ملی:</span><span class="rc-info-value">' + esc(student.nationalId) + '</span></div>' +
          '<div class="rc-info-item"><span class="rc-info-label">پایه:</span><span class="rc-info-value">' + esc(student.gradeName) + '</span></div>' +
          '<div class="rc-info-item"><span class="rc-info-label">تاریخ تولد:</span><span class="rc-info-value">' + esc(student.birthDate || '-') + '</span></div>' +
          '<div class="rc-info-item"><span class="rc-info-label">تلفن:</span><span class="rc-info-value">' + esc(student.phone || '-') + '</span></div>' +
          '<div class="rc-info-item"><span class="rc-info-label">تاریخ صدور:</span><span class="rc-info-value">' + new Date().toLocaleDateString('fa-IR') + '</span></div>' +
        '</div>' +
        '<div class="rc-photo"></div>' +
      '</div>' +
      tableHtml +
      '<div class="rc-summary"><div class="rc-summary-title">معدل ' + (monthIdx === -1 ? 'کل' : 'ماه ' + monthsNames[monthIdx]) + ':</div><div class="rc-summary-value">' + avg + '</div></div>' +
    '</div>' +
    signatureHtml +
  '</div>';
}
function showPrintModal(innerHtml) {
  const old = document.getElementById('printOverlay');
  if(old) old.remove();
  
  const overlay = document.createElement('div');
  overlay.id = 'printOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow:auto;padding:20px 0;';
  
  overlay.innerHTML = '<div style="max-width:800px;margin:0 auto;">' +
    '<div class="no-print" style="display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:10px;z-index:10;">' +
      '<button onclick="window.print()" style="background:#2e7d32;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);">🖨️ دانلود PDF</button>' +
      '<button onclick="document.getElementById(\'printOverlay\').remove()" style="background:#c62828;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);">✕ بستن</button>' +
    '</div>' +
    '<div id="print-area" style="display:flex;flex-direction:column;gap:20px;">' + innerHtml + '</div>' +
  '</div>';
  
  document.body.appendChild(overlay);
  
  if(!document.getElementById('printModalStyles')) {
    const style = document.createElement('style');
    style.id = 'printModalStyles';
    style.textContent = `
      @media print { 
        @page { size: A4 portrait; margin: 0; }
        body > *:not(#printOverlay) { display: none !important; } 
        #printOverlay { display: block !important; position: static !important; background: none !important; padding: 0 !important; overflow: visible !important; } 
        #printOverlay > div { max-width: 100% !important; margin: 0 !important; } 
        #print-area { display: block !important; gap: 0 !important; } 
        .no-print { display: none !important; } 
        .page { width: 100% !important; margin: 0 !important; box-shadow: none !important; border: none !important; page-break-inside: avoid !important; }
        .page.page-a4 { height: 296mm !important; page-break-after: always !important; }
        .page.page-a5 { height: 148mm !important; page-break-after: auto !important; }
      }
    `;
    document.head.appendChild(style);
  }
}

async function loadConductTable() {
  const container = document.getElementById('conductTableContainer');
  const classCode = document.getElementById('conductClassSelect').value;
  if (!container) return;
  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  try {
    const [rClasses, rConduct] = await Promise.all([
      fetch(API_URL + '?action=getAllClasses&t=' + Date.now()).then(r=>r.json()),
      fetch(API_URL + '?action=getConduct&classCode=' + encodeURIComponent(classCode) + '&t=' + Date.now()).then(r=>r.json())
    ]);

    if (!rClasses.success || !rClasses.data || !rClasses.data[classCode]) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">دانش‌آموزی در این کلاس نیست</div></div>';
      return;
    }

    const students = rClasses.data[classCode].students || [];
    if (students.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">دانش‌آموزی در این کلاس نیست</div></div>';
      return;
    }

    const existingConduct = (rConduct.success && rConduct.data) ? rConduct.data : [];
    const conductMap = {};
    existingConduct.forEach(c => conductMap[c.nationalId] = c);

    const months = [
      {key:'m', label:'مهر'}, {key:'aban', label:'آبان'}, {key:'azar', label:'آذر'}, {key:'mid1', label:'میان‌ترم ۱'}, {key:'dey', label:'دی'},
      {key:'bahman', label:'بهمن'}, {key:'esfand', label:'اسفند'}, {key:'farvardin', label:'فروردین'}, {key:'mid2', label:'میان‌ترم ۲'}, {key:'ordibehesht', label:'اردیبهشت'}, {key:'khordad', label:'خرداد'}
    ];

    let html = '<div class="grade-scroll"><table class="grade-table"><thead><tr><th class="grade-name">نام دانش‌آموز</th>';
    months.forEach(m => html += `<th>${m.label}</th>`);
    html += '</tr></thead><tbody>';

    students.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fa')).forEach(s => {
      const c = conductMap[s.nationalId] || {};
      html += `<tr><td class="grade-name">${esc(s.name)}</td>`;
      months.forEach(m => {
        let val = (c[m.key] !== undefined && c[m.key] !== null) ? c[m.key] : '';
        html += `<td><input class="grade-input conduct-input" data-nid="${escAttr(s.nationalId)}" data-key="${m.key}" value="${escAttr(val)}" placeholder="-"></td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;

    // فیلتر کردن ورودی‌ها به اعداد
    container.querySelectorAll('.conduct-input').forEach(inp => {
      inp.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9\.]/g, '');
      });
    });

  } catch(e) {
    console.error(e);
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطا در دریافت اطلاعات</div></div>';
  }
}

async function saveManagerConduct() {
  const classCode = document.getElementById('conductClassSelect').value;
  const inputs = document.querySelectorAll('.conduct-input');
  const recordsMap = {};

  inputs.forEach(inp => {
    const nid = inp.dataset.nid;
    const key = inp.dataset.key;
    const val = inp.value.trim();
    if (!recordsMap[nid]) recordsMap[nid] = {};
    recordsMap[nid][key] = val;
  });

  const records = Object.keys(recordsMap).map(nid => {
    return { nationalId: nid, ...recordsMap[nid] };
  });

  showToast('⏳ در حال ذخیره...');
  try {
    const params = new URLSearchParams();
    params.append('action', 'saveConduct');
    params.append('classCode', classCode);
    params.append('records', JSON.stringify(records));

    const r = await fetch(API_URL, { method: 'POST', body: params });
    const result = await r.json();
    if (result.success) {
      showToast('✅ نمرات انضباط با موفقیت ذخیره شد');
    } else {
      showToast('❌ ' + (result.message || 'خطا در ذخیره'));
    }
  } catch (e) {
    showToast('❌ خطای شبکه');
  }
}
function sortAnnouncements(arr) {
  const priorityScore = { 'مهم': 3, 'متوسط': 2, 'عادی': 1 };
  return [...arr].sort((a, b) => {
    const pa = priorityScore[a['اولویت']] || 0;
    const pb = priorityScore[b['اولویت']] || 0;
    if (pa !== pb) return pb - pa; // اولویت بالاتر بیاد بالا
    return 0; // اگه اولویت یکسان بود، ترتیب زمانی حفظ بشه
  });
}

    if (!res.success) return;
    
    const banner = document.getElementById('chatBlockBanner');
    const text = document.getElementById('chatBlockText');
    const inputBar = document.querySelector('.chat-input-bar');
    const ta = document.getElementById('chatInput');
    
    if (res.blocked) {
      if (banner) { banner.classList.add('visible'); if (text) text.textContent = res.message || 'چت غیرفعال است'; }
      if (inputBar) inputBar.classList.add('disabled');
      if (ta) ta.disabled = true;
    } else {
      if (banner) banner.classList.remove('visible');
      if (inputBar) inputBar.classList.remove('disabled');
      if (ta) ta.disabled = false;
    }
  } catch(e) {}
}

async function loadAdminGradeTable() {
  const container = document.getElementById('admGradeTableContainer');
  if (!container) return;
  
  const classCode = document.getElementById('admGradeClass').value;
  const subject = document.getElementById('admGradeSubject').value;
  
  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
  
  try {
    const [rClasses, rGrades] = await Promise.all([
      fetch(API_URL + '?action=getAllClasses&t=' + Date.now()).then(r=>r.json()),
      fetch(API_URL + '?action=getGrades&classCode=' + encodeURIComponent(classCode) + '&subject=' + encodeURIComponent(subject) + '&t=' + Date.now()).then(r=>r.json())
    ]);
    
    if (!rClasses.success || !rClasses.data || !rClasses.data[classCode]) {
      container.innerHTML = '<div class="empty-state"><div class="empty-title">دانش‌آموزی نیست</div></div>';
      return;
    }
    
    const students = rClasses.data[classCode].students || [];
    if (students.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-title">دانش‌آموزی نیست</div></div>';
      return;
    }
    
    const existingGrades = (rGrades.success && rGrades.data) ? rGrades.data : [];
    const gradeMap = {};
    existingGrades.forEach(g => gradeMap[g.nationalId] = g);
    
    const months = [
      {key:'m', label:'مهر'}, {key:'aban', label:'آبان'}, {key:'azar', label:'آذر'}, {key:'mid1', label:'میان‌ترم ۱'}, {key:'dey', label:'دی'},
      {key:'bahman', label:'بهمن'}, {key:'esfand', label:'اسفند'}, {key:'farvardin', label:'فروردین'}, {key:'mid2', label:'میان‌ترم ۲'}, {key:'ordibehesht', label:'اردیبهشت'}, {key:'khordad', label:'خرداد'}
    ];
    
    let html = '<table class="grade-table"><thead><tr><th class="grade-name">نام دانش‌آموز</th>';
    months.forEach(m => html += `<th>${m.label}</th>`);
    html += '</tr></thead><tbody>';
    
    students.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fa')).forEach(s => {
      const g = gradeMap[s.nationalId] || {};
      html += `<tr><td class="grade-name">${esc(s.name)}</td>`;
      months.forEach(m => {
        let val = (g[m.key] !== undefined && g[m.key] !== null) ? g[m.key] : '';
        let cls = 'grade-input';
        let disp = val;
        if (val === 'غیبت موجه') { disp = 'م'; }
        else if (val === 'غیبت غیرموجه') { disp = 'غ'; cls += ' absent'; }
        html += `<td><input class="${cls}" data-nid="${escAttr(s.nationalId)}" data-key="${m.key}" value="${escAttr(disp)}" placeholder="-"></td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    
    container.querySelectorAll('.grade-input').forEach(inp => {
      inp.addEventListener('input', function() {
        const v = this.value.trim();
        if (v === 'م' || v === 'غ') this.classList.toggle('absent', v === 'غ');
        else { this.classList.remove('absent'); this.value = this.value.replace(/[^0-9\.]/g, ''); }
      });
    });
  } catch(e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-title">خطا</div></div>';
  }
}

async function saveAdminGrades() {
  const classCode = document.getElementById('admGradeClass').value;
  const subject = document.getElementById('admGradeSubject').value;
  const teacherName = 'نامشخص'; // سیستم خودش دبیر واقعی رو پیدا میکنه  
  if (!subject) { showToast('درس را انتخاب کنید'); return; }
  
  const inputs = document.querySelectorAll('#admGradeTableContainer .grade-input');
  const recordsMap = {};
  inputs.forEach(inp => {
    const nid = inp.dataset.nid;
    const key = inp.dataset.key;
    let val = inp.value.trim();
    if (val === 'م') val = 'غیبت موجه';
    else if (val === 'غ') val = 'غیبت غیرموجه';
    if (!recordsMap[nid]) recordsMap[nid] = {};
    recordsMap[nid][key] = val;
  });
  
  const records = Object.keys(recordsMap).map(nid => ({ nationalId: nid, ...recordsMap[nid] }));
  
  showToast('⏳ در حال ذخیره...');
  try {
    const p = new URLSearchParams();
    p.append('action','saveGrades');
    p.append('classCode', classCode);
    p.append('subject', subject);
    p.append('teacher', teacherName); // 🎯 اینجا اسم دبیر رو می‌فرستیم
    p.append('records', JSON.stringify(records));
    const r = await fetch(API_URL, { method:'POST', body:p });
    const res = await r.json();
    if (res.success) showToast('✅ نمرات ذخیره شد');
    else showToast('❌ ' + (res.message||'خطا'));
  } catch(e) { showToast('❌ خطا'); }
}

// 🎯 تابع اصلاح شماره (اضافه کردن صفر)
function formatPhoneNumber(phone) {
  if (!phone) return '';
  let p = String(phone).replace(/\D/g, '');
  if (p.startsWith('98') && p.length > 10) p = p.substring(2);
  if (p.length === 10 && p.startsWith('9')) p = '0' + p;
  return p;
}

function switchSmsTab(type) {
  currentSmsFilter = type;
  document.getElementById('smsTabAbsent').classList.toggle('active', type === 'absent');
  document.getElementById('smsTabLate').classList.toggle('active', type === 'late');

    html += `

// 🎯 تابع تماس (با ثبت لاگ با GET)
function makeCall(phone, name) {
  if(!phone) { showToast('⚠️ شماره‌ای ثبت نشده'); return; }
  
  const url = API_URL + '?action=saveContactLog&studentName=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone) + '&type=' + encodeURIComponent('تماس') + '&status=' + encodeURIComponent('در حال تماس') + '&adminName=' + encodeURIComponent(currentUser.name) + '&t=' + Date.now();
  fetch(url).catch(()=>{});

  showToast('📞 در حال برقراری تماس...');
  window.location.href = 'tel:' + phone;
}

// 🎯 تابع پیامک تکی (با ثبت لاگ با GET)
function sendSingleSms(phone, name, status) {
  if(!phone) { showToast('⚠️ شماره‌ای ثبت نشده'); return; }
  
  const today = new Date().toLocaleDateString('fa-IR');
  let text = document.getElementById('smsTemplate').value;
  text = text.replace(/\[نام\]/g, name).replace(/\[تاریخ\]/g, today).replace(/\[وضعیت\]/g, status);

  const url = API_URL + '?action=saveContactLog&studentName=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone) + '&type=' + encodeURIComponent('پیامک') + '&status=' + encodeURIComponent('آماده ارسال') + '&adminName=' + encodeURIComponent(currentUser.name) + '&t=' + Date.now();
  fetch(url).catch(()=>{});

  showToast('📲 در حال باز کردن پیام‌رسان...');
  window.location.href = `sms:${phone}?body=${encodeURIComponent(text)}`;
}

// 🎯 دکمه ارسال تکی پایین پنجره
function sendSelectedSms() {
  const checked = document.querySelectorAll('.sms-cb:checked');
  if (checked.length === 0) { showToast('⚠️ حداقل یک نفر را انتخاب کنید'); return; }
  if (checked.length > 1) { showToast('⚠️ برای ارسال شخصی، فقط یک نفر را انتخاب کنید.'); return; }
  
  const cb = checked[0];
  sendSingleSms(cb.value, cb.dataset.name, cb.dataset.status);
}

// 🎯 کپی گروهی
function copyBulkSms() {
  const checked = document.querySelectorAll('.sms-cb:checked');
  if (checked.length === 0) { showToast('⚠️ حداقل یک نفر را انتخاب کنید'); return; }

  const phones = [];
  checked.forEach(cb => { if(cb.value) phones.push(cb.value); });
  
  const today = new Date().toLocaleDateString('fa-IR');
  let text = document.getElementById('smsTemplate').value;
  text = text.replace(/\[نام\]/g, 'فرزند شما').replace(/\[تاریخ\]/g, today).replace(/\[وضعیت\]/g, currentSmsFilter === 'absent' ? 'غیبت' : 'تاخیر');

  const fullText = `شماره‌ها:\n${phones.join(', ')}\n\nمتن پیام:\n${text}`;

  navigator.clipboard.writeText(fullText).then(() => {
    showToast('✅ کپی شد! در پیام‌رسان گوشی پیست کنید.');
  }).catch(() => { showToast('❌ خطا در کپی'); });
}

function toJalaliFromISO(iso){
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime()))return iso;
    return toJalaliDate(d);
  }catch(e){return iso;}
}

function toJalaliDate(d){
  try{
    const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
    const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
    let jy=(y<=1600)?0:979;
    let yy=(y<=1600)?y:y-1600;
    const gy2=(m>2)?(yy+1):yy;
    let days=(365*yy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+day+g_d_m[m-1];
    jy+=33*Math.floor(days/12053);days%=12053;
    jy+=4*Math.floor(days/1461);days%=1461;
    if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
    const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
    const jd=1+((days<186)?(days%31):((days-186)%30));
    return jy+'/'+(jm<10?'0':'')+jm+'/'+(jd<10?'0':'')+jd;
  }catch(e){return String(d);}
}

const APP_VERSION = '1.1.0';  // ← هر بار آپدیت دادی، این رو هم عوض کن

async function checkForUpdate(){
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) return;
    const data = await r.json();
    if(!data.version) return;
    if(data.version === APP_VERSION) return; // نسخه یکسان

    // نسخه جدید هست
    if(data.force){
      // آپدیت اجباری
      document.getElementById('upNotes').textContent = data.notes || 'به‌روزرسانی لازم است';
      document.getElementById('updateBanner').style.display = 'flex';
      // مخفی کردن دکمه بعداً
      const laterBtn = document.querySelector('.update-btn-later');
      if(laterBtn) laterBtn.style.display = 'none';
      return;
    }

    // بررسی که کاربر قبلاً رد نکرده باشه
    const dismissedVersion = localStorage.getItem('update_dismissed_version');
    const dismissedTime = parseInt(localStorage.getItem('update_dismissed_time') || '0');
    if(dismissedVersion === data.version){
      // اگه کمتر از ۲۴ ساعت گذشته، نشون نده
      if(Date.now() - dismissedTime < 24*60*60*1000) return;
    }

    document.getElementById('upNotes').textContent = data.notes || 'نسخه ' + data.version + ' آماده است';
    document.getElementById('updateBanner').style.display = 'flex';
    localStorage.setItem('update_new_version', data.version);
  }catch(e){
    // خطا → ساکت بمون، کاربر رو اذیت نکن
  }
}

function doUpdate(){
  // پاک کردن همه کش‌ها
  if('caches' in window){
    caches.keys().then(names => {
      return Promise.all(names.map(n => caches.delete(n)));
    }).then(() => {
      // پاک کردن Service Workerها (اگه هستن)
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(regs => {
          Promise.all(regs.map(r => r.unregister()));
        });
      }
      // بارگذاری مجدد بعد از پاک‌سازی
      setTimeout(() => {
        window.location.reload(true);
      }, 500);
    });
  } else {
    // مرورگر قدیمی
    window.location.reload(true);
  }
}

      const startEl = document.getElementById('curfewStart');
      const endEl = document.getElementById('curfewEnd');
      const enabled = document.getElementById('mgrChatSection') ? (document.querySelector('[onclick*="toggleCurfew"]')?.textContent?.includes('غیرفعال') || false) : false;

function updateCurfewLiveStatus(start, end, enabled) {
  const el = document.getElementById('curfewLiveStatus');
  if (!el) return;
  
  // بررسی اینکه آیا ساعت‌بندی فعاله (از روی دکمه)
  const toggleBtn = document.querySelector('#mgrChatSection button[onclick*="toggleCurfew"]');
  const isEnabled = toggleBtn ? toggleBtn.textContent.includes('غیرفعال') : false;
  
  if (!isEnabled) {
    el.textContent = '⏸ ساعت‌بندی غیرفعال است';
    el.style.color = '#6b7890';
    return;
  }
  
  const now = new Date();
  const c = now.getHours() * 60 + now.getMinutes();
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const s = sh * 60 + sm, e = eh * 60 + em;
  const blocked = (s <= e) ? (c >= s && c < e) : (c >= s || c < e);
  
  if (blocked) {
    el.textContent = '🔒 الان چت دانش‌آموزان بسته است (تا ' + end + ')';
    el.style.color = '#c62828';
  } else {
    el.textContent = '🔓 الان چت دانش‌آموزان باز است';
    el.style.color = '#2e7d32';
  }
}

async function saveCurfewSettings() {
  const start = document.getElementById('curfewStart').value;
  const end = document.getElementById('curfewEnd').value;
  if (!start || !end) { showToast('⚠️ هر دو ساعت رو وارد کنید'); return; }
  try {
    const p1 = new URLSearchParams();
    p1.append('action','updateSettings'); p1.append('key','chat_curfew_start'); p1.append('value',start); p1.append('role',currentUser.role);
    await fetch(API_URL, { method:'POST', body:p1 });
    const p2 = new URLSearchParams();
    p2.append('action','updateSettings'); p2.append('key','chat_curfew_end'); p2.append('value',end); p2.append('role',currentUser.role);
    await fetch(API_URL, { method:'POST', body:p2 });
    showToast('✅ ساعات ذخیره شد');
    loadChatSettings();
  } catch(e) { showToast('❌ خطا'); }
}
function downloadContactLogsExcel() {
  if(!window._currentContactLogsFiltered || window._currentContactLogsFiltered.length === 0) {
    showToast('⚠️ داده‌ای برای دانلود وجود ندارد');
    return;
  }

  const data = window._currentContactLogsFiltered.map(log => ({
    'تاریخ': String(log.date || ''),
    'ساعت': String(log.time || ''),
    'نام دانش‌آموز': String(log.name || ''),
    'شماره تماس': String(log.phone || ''),
    'نوع عملیات': String(log.type || ''),
    'وضعیت': String(log.status || ''),
    'ثبت‌کننده': String(log.admin || '')
  }));

  try {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(data);
    const range = XLSX.utils.decode_range(ws['!ref']);
    
    // 🎯 اجبار همه سلول‌ها به متن (برای جلوگیری از خرابی تاریخ در اکسل)
    for(let R=0; R<=range.e.r; R++){
      for(let C=0; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R, c:C})];
        if(cell) { cell.t='s'; cell.z='@'; if(cell.v!=null) cell.v=String(cell.v); }
      }
    }

    ws['!cols'] = [{wch:12},{wch:10},{wch:20},{wch:15},{wch:12},{wch:15},{wch:15}];
    XLSX.utils.book_append_sheet(wb, ws, 'گزارش تماس');
    
    const fileName = 'گزارش تماس و پیامک - ' + window._contactLogDate.replace(/\//g,'-') + '.xlsx';
    XLSX.writeFile(wb, fileName);
    showToast('✅ فایل دانلود شد');
  } catch(err) {
    console.error(err);
    showToast('❌ خطا در ساخت فایل');
  }
}
async function changeLogStatus(rowIndex, currentStatus) {
  let newStatus = prompt('وضعیت جدید را وارد کنید (مثلاً: ارسال شد، پاسخ داد، ارسال نشد):', currentStatus);
  if(!newStatus) return;
  try {
    const url = API_URL + '?action=updateContactLogStatus&rowIndex=' + rowIndex + '&status=' + encodeURIComponent(newStatus) + '&t=' + Date.now();
    const r = await fetch(url);
    const res = await r.json();
    if(res.success) { showToast('✅ وضعیت تغییر کرد'); loadContactLogs(); }
    else showToast('❌ ' + (res.message || 'خطا'));
  } catch(e) { showToast('❌ خطا در ارتباط'); }
}

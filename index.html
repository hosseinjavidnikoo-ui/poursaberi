<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<title>مدرسه پورصابری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0f3f9;--card:#fff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5;--line:#e3e9f2;--header-1:#0d1440;--header-2:#1a237e;--header-3:#3949ab;--accent:#3949ab;--shadow:rgba(26,35,126,.08);--shadow-strong:rgba(26,35,126,.15);--chat-bg:#e7ebf2;--chat-my:#d9fdd3;--chat-other:#fff}
html.dark{--bg:#0f1422;--card:#1a2138;--text:#e8eefc;--text-soft:#a4b0c8;--text-muted:#7b87a0;--line:#2a3350;--header-1:#050814;--header-2:#0d1440;--header-3:#1a237e;--accent:#5c6bc0;--shadow:rgba(0,0,0,.3);--shadow-strong:rgba(0,0,0,.5);--chat-bg:#0b1018;--chat-my:#005c4b;--chat-other:#1f2937}
html,body{font-family:'Vazirmatn','Tahoma',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.app-header{background:linear-gradient(135deg,var(--header-1),var(--header-2) 50%,var(--header-3));color:#fff;padding:12px 14px;box-shadow:0 4px 16px var(--shadow-strong);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto;gap:10px}
.header-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-center{flex:1;text-align:center;min-width:0}
.header-center h1{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-center .sub{font-size:10px;opacity:.88;margin-top:2px}
.user-bar{max-width:720px;margin:8px auto 0;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:11.5px}
.user-bar .user-info{display:flex;align-items:center;gap:8px;min-width:0}
.user-bar .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffd54f,#ffb300);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#5d4037;flex-shrink:0}
.user-bar .user-name{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-bar .user-role{font-size:10px;opacity:.85}
.user-bar .logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 12px;border-radius:12px;font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.tab-bar{display:flex;gap:4px;padding:10px 12px 0;max-width:720px;margin:0 auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.tab-btn{flex:1 0 auto;min-width:68px;padding:10px 5px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:10px;font-weight:700;color:var(--text-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:all .2s}

/* موبایل: اسکرول‌بار مخفی (با انگشت اسکرول می‌شه) */
@media (hover: none), (pointer: coarse) {
  .tab-bar{scrollbar-width:none}
  .tab-bar::-webkit-scrollbar{display:none}
}

/* دسکتاپ (ویندوز/مک): اسکرول‌بار نازک نمایش داده بشه */
@media (hover: hover) and (pointer: fine) {
  .tab-bar{padding-bottom:8px;scrollbar-width:thin;scrollbar-color:rgba(26,35,126,.3) transparent}
  .tab-bar::-webkit-scrollbar{height:6px}
  .tab-bar::-webkit-scrollbar-track{background:transparent}
  .tab-bar::-webkit-scrollbar-thumb{background:rgba(26,35,126,.3);border-radius:3px}
  .tab-bar::-webkit-scrollbar-thumb:hover{background:rgba(26,35,126,.5)}
}
.tab-btn .tab-icon{font-size:17px;line-height:1}
.tab-btn.active{background:linear-gradient(135deg,var(--header-2),var(--header-3));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--shadow-strong)}
.tab-btn .tab-badge{position:absolute;top:-4px;right:-4px;background:#ff5252;color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;min-width:16px;text-align:center;display:none;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tab-btn .tab-badge.visible{display:block}
.container{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}
.sub-tab{flex:1;padding:9px 8px;background:transparent;border:none;border-radius:9px;font-family:inherit;font-size:12px;font-weight:700;color:var(--text-soft);cursor:pointer}
.sub-tab.active{background:linear-gradient(135deg,var(--header-2),var(--header-3));color:#fff}
.form-card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow);margin-bottom:14px}
.form-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.form-card-header .icon-box{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:linear-gradient(135deg,#ffd54f,#ffb300);border-radius:12px;font-size:20px}
.form-card-header .title{font-size:14px;font-weight:700;color:var(--header-2)}
html.dark .form-card-header .title{color:#9fa8da}
.form-card-header .sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.form-input,.form-textarea,.form-select{width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-family:inherit;font-size:13px;outline:none}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.priority-picker{display:flex;gap:8px;margin-top:6px}
.priority-option{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;text-align:center;font-size:11.5px;font-weight:700;font-family:inherit;color:var(--text-soft)}
.priority-option.selected.normal{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32}
.priority-option.selected.medium{border-color:#ef6c00;background:#fff3e0;color:#ef6c00}
.priority-option.selected.high{border-color:#c62828;background:#ffebee;color:#c62828}
html.dark .priority-option.selected.normal{background:rgba(46,125,50,.2);color:#81c784}
html.dark .priority-option.selected.medium{background:rgba(239,108,0,.2);color:#ffb74d}
html.dark .priority-option.selected.high{background:rgba(198,40,40,.2);color:#ff8a80}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(46,125,50,.3)}
.submit-btn.primary-blue{background:linear-gradient(135deg,#1a237e,#3949ab);box-shadow:0 4px 12px rgba(26,35,126,.3)}
.submit-btn.primary-orange{background:linear-gradient(135deg,#ef6c00,#f57c00);box-shadow:0 4px 12px rgba(239,108,0,.3)}
.submit-btn:disabled{opacity:.6}
.exam-card{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow);padding:14px;border-right:4px solid #3949ab}
.exam-card.term{border-right-color:#1a237e}
.exam-card.class-exam{border-right-color:#ef6c00}
.exam-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.exam-card-title{font-size:14px;font-weight:800;color:var(--text);flex:1}
.exam-card-type{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.exam-card-type.term{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#0d47a1}
.exam-card-type.class-exam{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#e65100}
.exam-card-info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.exam-info-item{display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--text-soft)}
.exam-card-desc{font-size:12.5px;color:var(--text-soft);line-height:1.7;padding-top:8px;border-top:1px dashed var(--line);white-space:pre-wrap}
.exam-card-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.exam-action-btn{flex:1;padding:8px;border-radius:9px;border:none;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.exam-action-btn.danger{background:#ffebee;color:#c62828}
.exam-action-btn.info{background:#e3f2fd;color:#0d47a1}
.hw-card{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow);padding:14px;border-right:4px solid #2e7d32}
.hw-card.done{border-right-color:#43a047;background:linear-gradient(90deg,rgba(46,125,50,.05),var(--card))}
.hw-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.hw-card-title{font-size:14px;font-weight:800;color:var(--text);flex:1}
.hw-status-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700}
.hw-status-badge.pending{background:#fff3e0;color:#e65100}
.hw-status-badge.done{background:#e8f5e9;color:#2e7d32}
.hw-card-info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.hw-info-item{display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--text-soft)}
.hw-card-desc{font-size:12.5px;color:var(--text-soft);line-height:1.7;padding:8px 0;white-space:pre-wrap}
.hw-mark-btn{width:100%;padding:10px;border-radius:10px;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;margin-top:8px}
.hw-mark-btn.done{background:#e8f5e9;color:#2e7d32}
.hw-upload-btn{width:100%;padding:10px;border-radius:10px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.hw-file-info{margin-top:8px;padding:8px 12px;background:#e3f2fd;border-radius:8px;font-size:11px;color:#0d47a1;display:flex;align-items:center;gap:6px}
.hw-file-info a{color:#0d47a1;text-decoration:none;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat-box .stat-num{font-size:22px;font-weight:800;color:var(--header-2)}
.stat-box .stat-num.green{color:#2e7d32}
.stat-box .stat-num.red{color:#c62828}
.stat-box .stat-num.orange{color:#ef6c00}
.stat-box .stat-num.blue{color:#1976d2}
.stat-box .stat-label{font-size:10.5px;color:var(--text-soft);margin-top:4px}
.student-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.student-row .s-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;color:#fff;background:linear-gradient(135deg,#1a237e,#3949ab)}
.student-row .s-avatar.done{background:linear-gradient(135deg,#2e7d32,#43a047)}
.student-row .s-avatar.pending{background:linear-gradient(135deg,#bdbdbd,#9e9e9e)}
.student-row .s-info{flex:1;min-width:0}
.student-row .s-name{font-size:12.5px;font-weight:700;color:var(--text)}
.student-row .s-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700}
.student-row .s-badge.done{background:#e8f5e9;color:#2e7d32}
.student-row .s-badge.pending{background:#f5f5f5;color:#757575}
.student-row .s-file-btn{padding:6px 12px;border-radius:8px;background:#e3f2fd;color:#0d47a1;font-size:10.5px;font-weight:700;border:none;cursor:pointer}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:52px;opacity:.4;margin-bottom:14px}
.empty-state .empty-title{font-size:15px;font-weight:700;color:var(--text-soft);margin-bottom:6px}
.empty-state .empty-desc{font-size:12.5px;line-height:1.7;max-width:320px;margin:0 auto}
.loading-spinner{text-align:center;padding:40px 20px;color:var(--text-muted)}
.loading-spinner .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;right:50%;transform:translateX(50%) translateY(100px);background:#323232;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:all .3s;z-index:600;max-width:90%;text-align:center}
.toast.visible{opacity:1;transform:translateX(50%) translateY(0)}
.app-footer{text-align:center;font-size:10.5px;color:var(--text-muted);padding:16px 12px 30px;line-height:1.7}
.day-block{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.day-block.highlight{border-color:#ffd54f;background:linear-gradient(90deg,rgba(255,213,79,.08),var(--card))}
.day-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--header-2);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
html.dark .day-title{color:#9fa8da}
.today-badge{margin-right:auto;font-size:10px;background:linear-gradient(135deg,#ffd54f,#ffb300);color:#3e2723;padding:2px 8px;border-radius:10px;font-weight:700}
.lesson-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px dashed var(--line)}
.lesson-row:last-child{border-bottom:none}
.z-num{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;background:linear-gradient(135deg,#e8edf6,#d6dff0);color:#3949ab;border-radius:8px;font-size:11.5px;font-weight:700}
.lesson-content{flex:1;min-width:0}
.lesson-name{font-size:13px;font-weight:700;color:var(--text)}
.teacher-name{font-size:11px;color:var(--text-soft)}
.lesson-row.empty .lesson-name{color:var(--text-muted);font-weight:400}
.lesson-row.rot{background:linear-gradient(90deg,rgba(255,248,225,.7),rgba(255,248,225,.3));padding:7px 8px;margin:2px 0;border-bottom:none;border-radius:8px}
.lesson-row.rot .z-num{background:linear-gradient(135deg,#ffe082,#ffb300);color:#5d4037}
.lesson-row.rot .lesson-name{color:#a84800}
.announcement{background:var(--card);border-radius:14px;margin-bottom:10px;padding:14px 15px;border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow);position:relative;overflow:hidden}
.announcement::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.announcement.high::before{background:#c62828}
.announcement.medium::before{background:#ef6c00}
.announcement.normal::before{background:#2e7d32}
.announcement-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.announcement-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;flex:1}
.announcement-priority{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700}
.announcement-priority.high{background:#ffebee;color:#c62828}
.announcement-priority.medium{background:#fff3e0;color:#ef6c00}
.announcement-priority.normal{background:#e8f5e9;color:#2e7d32}
.announcement-body{font-size:12.5px;color:var(--text-soft);line-height:1.7;white-space:pre-wrap}
.announcement-footer{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--text-muted)}
.school-info{background:var(--card);border-radius:14px;padding:15px;margin-top:14px;border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow)}
.info-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--header-2);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.info-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.info-icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:linear-gradient(135deg,var(--bg),var(--line));border-radius:9px;font-size:14px}
.info-label{font-size:10.5px;color:var(--text-muted);margin-bottom:2px}
.info-value{font-size:12.5px;color:var(--text);font-weight:600;direction:ltr;text-align:right}
.info-value.fa{direction:rtl;font-weight:500;line-height:1.7}
.info-value a{color:var(--accent);text-decoration:none;font-weight:700}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text-soft);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:12px}
.welcome-card{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 20px rgba(26,35,126,.3)}
.welcome-inner{padding:20px 18px;position:relative;overflow:hidden}
.welcome-inner .w-emoji{font-size:36px;margin-bottom:8px;display:block}
.welcome-inner .w-hello{font-size:16px;font-weight:800;margin-bottom:4px}
.welcome-inner .w-sub{font-size:12px;opacity:.9}
.welcome-inner .w-date{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);font-size:11px;opacity:.85}
.welcome-banner{padding:14px 16px;cursor:pointer;position:relative;border-bottom:1px solid rgba(255,255,255,.15)}
.welcome-banner.high{background:linear-gradient(135deg,#ffebee,#ffcdd2)}
.welcome-banner.medium{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}
.welcome-banner .wb-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;font-weight:800;color:#c62828}
.welcome-banner.medium .wb-head{color:#e65100}
.welcome-banner .wb-badge{background:#c62828;color:#fff;padding:2px 8px;border-radius:10px;font-size:9.5px}
.welcome-banner.medium .wb-badge{background:#ef6c00}
.welcome-banner .wb-arrow{margin-right:auto;font-size:13px;opacity:.7}
.welcome-banner .wb-title{font-size:14px;font-weight:800;color:#1a2233;margin-bottom:4px}
html.dark .welcome-banner .wb-title{color:#e8eefc}
.welcome-banner .wb-body{font-size:12px;color:#5a6a85;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.dark .welcome-banner .wb-body{color:#a4b0c8}
.welcome-banner .wb-footer{margin-top:7px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.1);font-size:10px;color:#6b7890;display:flex;justify-content:space-between}
.welcome-banner .wb-dismiss{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.1);border:none;color:#5a6a85;cursor:pointer;font-size:12px;z-index:2}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.shortcut{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px var(--shadow);font-family:inherit;text-align:right;color:var(--text)}
.shortcut .sc-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.shortcut .sc-icon.blue{background:linear-gradient(135deg,#e3f2fd,#bbdefb)}
.shortcut .sc-icon.green{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.shortcut .sc-icon.orange{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}
.shortcut .sc-icon.purple{background:linear-gradient(135deg,#f3e5f5,#e1bee7)}
.shortcut .sc-icon.red{background:linear-gradient(135deg,#ffebee,#ffcdd2)}
.shortcut .sc-icon.teal{background:linear-gradient(135deg,#e0f2f1,#b2dfdb)}
.shortcut .sc-text{flex:1;min-width:0}
.shortcut .sc-title{font-size:12.5px;font-weight:700;color:var(--text)}
.shortcut .sc-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.chat-list-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.chat-list-item .cl-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,#e3f2fd,#bbdefb)}
.chat-list-item .cl-avatar.class{background:linear-gradient(135deg,#e3f2fd,#90caf9)}
.chat-list-item .cl-avatar.staff{background:linear-gradient(135deg,#f3e5f5,#ce93d8)}
.chat-list-item .cl-avatar.private{background:linear-gradient(135deg,#e8f5e9,#a5d6a7)}
.chat-list-item .cl-avatar.saved{background:linear-gradient(135deg,#fff3e0,#ffcc80)}
.chat-list-item .cl-text{flex:1;min-width:0}
.chat-list-item .cl-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-item .cl-sub{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-item .cl-meta{text-align:left;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chat-list-item .cl-time{font-size:10px;color:var(--text-muted)}
.chat-list-item .cl-unread{background:#25d366;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;min-width:20px;text-align:center}
.chat-room{display:none;flex-direction:column;height:calc(100vh - 130px);min-height:400px;background:var(--chat-bg);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.chat-room.active{display:flex}
.chat-room-header{background:linear-gradient(135deg,var(--header-2),var(--header-3));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.chat-room-header .back-chat{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-room-header .cr-title{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-room-header .cr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search-bar-chat{background:var(--card);padding:8px 12px;border-bottom:1px solid var(--line);display:none;gap:8px;align-items:center}
.search-bar-chat.visible{display:flex}
.search-bar-chat input{flex:1;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;font-family:inherit;font-size:12.5px;outline:none}
.search-bar-chat button{background:transparent;border:none;color:var(--text-soft);cursor:pointer;font-size:16px;padding:4px}
.chat-messages{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px}
.msg-row{display:flex;flex-direction:column;position:relative}
.msg-row.mine{align-items:flex-start}
.msg-row.other{align-items:flex-end}
.msg-bubble{max-width:78%;padding:7px 12px;border-radius:14px;position:relative;word-wrap:break-word;font-size:13px;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.msg-bubble.mine{background:var(--chat-my);border-bottom-left-radius:4px}
.msg-bubble.other{background:var(--chat-other);border-bottom-right-radius:4px}
.msg-bubble.pinned{border:2px solid #ffb300}
.msg-bubble .mb-sender{font-size:10.5px;font-weight:700;color:var(--header-3);margin-bottom:3px}
html.dark .msg-bubble .mb-sender{color:#90caf9}
.msg-bubble .mb-reply{background:rgba(0,0,0,.06);border-right:3px solid var(--header-3);padding:5px 8px;border-radius:6px;margin-bottom:5px;font-size:11px}
html.dark .msg-bubble .mb-reply{background:rgba(255,255,255,.06);border-right-color:#90caf9}
.msg-bubble .mb-reply .mb-reply-sender{font-weight:700;color:var(--header-3);margin-bottom:2px}
html.dark .msg-bubble .mb-reply .mb-reply-sender{color:#90caf9}
.msg-bubble .mb-reply .mb-reply-text{color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-bubble .mb-text{color:var(--text);white-space:pre-wrap}
.msg-bubble .mb-meta{font-size:9.5px;color:var(--text-muted);text-align:left;margin-top:3px;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.msg-bubble .mb-pin{color:#ffb300;font-size:11px}
.msg-bubble .mb-edited{font-style:italic}
.msg-bubble .mb-file{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text);margin-top:4px;font-size:12px}
html.dark .msg-bubble .mb-file{background:rgba(255,255,255,.1)}
.msg-reactions{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.msg-reactions .mr-chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--text)}
.msg-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:flex-end;justify-content:center}
.msg-menu-backdrop.visible{display:flex;animation:fadeIn .2s}
.msg-menu{background:var(--card);border-radius:20px 20px 0 0;padding:14px;width:100%;max-width:500px;padding-bottom:24px}
.msg-menu .mm-title{font-size:11.5px;color:var(--text-muted);text-align:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-menu .mm-actions{display:flex;flex-direction:column;gap:6px}
.msg-menu .mm-btn{padding:13px 16px;background:var(--bg);border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);text-align:right;cursor:pointer;display:flex;align-items:center;gap:10px}
.msg-menu .mm-btn .mm-icon{font-size:18px;width:24px;text-align:center}
.msg-menu .mm-btn.danger{color:#c62828}
html.dark .msg-menu .mm-btn.danger{color:#ff8a80}
.reply-preview{background:var(--card);padding:8px 12px;border-top:1px solid var(--line);display:none;align-items:center;gap:10px;flex-shrink:0}
.reply-preview.visible{display:flex}
.reply-preview .rp-content{flex:1;min-width:0;background:var(--bg);border-right:3px solid var(--header-3);padding:6px 10px;border-radius:6px}
.reply-preview .rp-sender{font-size:10.5px;font-weight:700;color:var(--header-3);margin-bottom:2px}
.reply-preview .rp-text{font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-preview .rp-close{background:transparent;border:none;color:var(--text-soft);font-size:18px;cursor:pointer;padding:4px}
.edit-preview{background:#fff8e1;padding:8px 12px;display:none;align-items:center;gap:10px;border-top:1px solid var(--line);font-size:11.5px;color:#8a6d00;flex-shrink:0}
.edit-preview.visible{display:flex}
html.dark .edit-preview{background:rgba(255,179,0,.15);color:#ffd54f}
.edit-preview .ep-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-preview .ep-close{background:transparent;border:none;color:inherit;font-size:18px;cursor:pointer;padding:4px}
.chat-input-bar{background:var(--card);padding:10px 12px;display:flex;align-items:flex-end;gap:6px;flex-shrink:0;border-top:1px solid var(--line)}
.chat-input-bar textarea{flex:1;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:22px;font-family:inherit;font-size:13px;outline:none;resize:none;max-height:100px;line-height:1.5;min-height:40px}
.chat-input-bar .ci-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-family:inherit}
.chat-input-bar .ci-send{background:linear-gradient(135deg,#25d366,#1eb954);color:#fff;box-shadow:0 3px 8px rgba(37,211,102,.3)}
.chat-input-bar .ci-send:disabled{opacity:.5}
.chat-input-bar .ci-attach,.chat-input-bar .ci-emoji,.chat-input-bar .ci-mic{background:var(--bg);color:var(--text-soft);border:1px solid var(--line)}
.chat-input-bar .ci-mic.recording{background:linear-gradient(135deg,#c62828,#e53935);color:#fff;border-color:transparent;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.6)}50%{box-shadow:0 0 0 8px rgba(198,40,40,0)}}
.voice-recording{display:none;position:absolute;bottom:70px;right:10px;left:10px;background:linear-gradient(135deg,#c62828,#e53935);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(198,40,40,.4);z-index:60;align-items:center;gap:12px;font-weight:700}
.voice-recording.visible{display:flex}
.voice-recording .vr-dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:vrBlink 1s infinite}
@keyframes vrBlink{0%,100%{opacity:1}50%{opacity:.3}}
.voice-recording .vr-time{font-size:15px;direction:ltr;font-variant-numeric:tabular-nums}
.voice-recording .vr-cancel,.voice-recording .vr-stop{border:none;padding:7px 14px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.voice-recording .vr-cancel{background:rgba(255,255,255,.2);color:#fff;margin-right:auto}
.voice-recording .vr-stop{background:#fff;color:#c62828}
.msg-bubble .mb-audio{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.06);padding:8px 12px;border-radius:10px;margin-top:4px;min-width:200px;max-width:280px;flex-wrap:wrap}
html.dark .msg-bubble .mb-audio{background:rgba(255,255,255,.1)}
.msg-bubble .mb-audio audio{width:100%;height:36px;max-width:240px}
.voice-play-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(21,101,192,.3)}
.voice-play-btn:disabled{opacity:.7;cursor:wait}
.voice-play-btn .vp-icon{font-size:14px}
.voice-play-btn .vp-text{white-space:nowrap}
.msg-bubble .mb-image{margin-top:6px;border-radius:10px;overflow:hidden}
.msg-bubble .mb-image img{max-width:100%;max-height:300px;border-radius:10px;cursor:pointer;display:block}
.msg-bubble .mb-video{margin-top:6px}
.video-thumb{position:relative;width:220px;height:130px;background:linear-gradient(135deg,#1a237e,#3949ab);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.video-thumb .vt-play{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.95);color:#1a237e;font-size:22px;display:flex;align-items:center;justify-content:center;padding-right:3px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.video-thumb .vt-label{font-size:11px;color:rgba(255,255,255,.9);font-weight:700}
.staff-picker{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px}
.staff-picker .sp-title{font-size:12.5px;font-weight:700;color:var(--header-2);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
html.dark .staff-picker .sp-title{color:#9fa8da}
.staff-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:6px;cursor:pointer}
.staff-item .st-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#e3f2fd,#90caf9);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#0d47a1;flex-shrink:0}
.staff-item .st-info{flex:1;min-width:0}
.staff-item .st-name{font-size:12.5px;font-weight:700;color:var(--text)}
.staff-item .st-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.emoji-picker{display:none;position:absolute;bottom:70px;right:10px;left:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px;max-height:260px;overflow-y:auto;z-index:50}
.emoji-picker.visible{display:block;animation:epSlide .2s ease}
@keyframes epSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.emoji-picker .ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-picker .ep-emoji{font-size:22px;padding:6px 0;text-align:center;cursor:pointer;border-radius:8px;border:none;background:transparent;font-family:inherit;line-height:1}
@media (min-width:720px){.emoji-picker .ep-grid{grid-template-columns:repeat(12,1fr)}}
.search-results{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow-y:auto;margin-bottom:6px}
.search-results .sr-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.search-results .sr-item:last-child{border-bottom:none}
.search-results .sr-item .sr-sender{font-weight:700;color:var(--header-3);font-size:11px;margin-bottom:3px}
.search-results .sr-item .sr-text{color:var(--text-soft);line-height:1.5}
.search-results .sr-item .sr-time{font-size:10px;color:var(--text-muted);margin-top:3px}
.search-results-empty{padding:20px;text-align:center;color:var(--text-muted);font-size:12px}
.reactions-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:510;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.reactions-backdrop.visible{display:flex;animation:fadeIn .2s}
.reactions-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:18px 14px 24px;width:100%;max-width:520px;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.rs-title{font-size:13px;font-weight:700;color:var(--text);text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
.rs-emoji{font-size:26px;padding:10px 0;background:var(--bg);border:1px solid var(--line);border-radius:14px;cursor:pointer;line-height:1;font-family:inherit}
.rs-cancel{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer}
@media (min-width:520px){.rs-grid{grid-template-columns:repeat(8,1fr)}}
.theme-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:510;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.theme-backdrop.visible{display:flex;animation:fadeIn .2s}
.theme-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:18px 14px 24px;width:100%;max-width:520px;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.th-title{font-size:13px;font-weight:700;color:var(--text);text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.th-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (min-width:400px){.th-grid{grid-template-columns:repeat(4,1fr)}}
.th-item{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer;text-align:center;font-family:inherit}
.th-item.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,73,171,.18)}
.th-preview{width:100%;height:44px;border-radius:10px;margin-bottom:6px;display:flex;flex-direction:column;gap:3px;padding:5px;overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.th-preview .thp-bubble{height:12px;border-radius:6px;width:65%}
.th-preview .thp-bubble.mine{align-self:flex-start}
.th-preview .thp-bubble.other{align-self:flex-end}
.th-name{font-size:10.5px;font-weight:700;color:var(--text)}
.th-cancel{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer}
.chat-room[data-theme="classic"]{--chat-bg:#e7ebf2;--chat-my:#d9fdd3;--chat-other:#ffffff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5}
.chat-room[data-theme="blue"]{--chat-bg:#e7f0fb;--chat-my:#cfe8ff;--chat-other:#ffffff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5}
.chat-room[data-theme="purple"]{--chat-bg:#f0e9ff;--chat-my:#e8dcff;--chat-other:#ffffff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5}
.chat-room[data-theme="pink"]{--chat-bg:#fce7f0;--chat-my:#ffd6e8;--chat-other:#ffffff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5}
.chat-room[data-theme="teal"]{--chat-bg:#e0f5f5;--chat-my:#c8f0f0;--chat-other:#ffffff;--text:#1a2233;--text-soft:#6b7890;--text-muted:#97a2b5}
.chat-room[data-theme="dark"]{--chat-bg:#0b1018;--chat-my:#005c4b;--chat-other:#1f2937;--text:#e8eefc;--text-soft:#a4b0c8;--text-muted:#7b87a0}
.chat-room[data-theme="dark-blue"]{--chat-bg:#0d1a2e;--chat-my:#1e4d80;--chat-other:#2a3a5c;--text:#e8eefc;--text-soft:#a4b0c8;--text-muted:#7b87a0}
.att-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;transition:all .2s}
.att-row.absent{border-color:#ef9a9a;background:linear-gradient(90deg,rgba(198,40,40,.05),var(--card))}
.att-row.late{border-color:#ffcc80;background:linear-gradient(90deg,rgba(239,108,0,.05),var(--card))}
.att-row.leave{border-color:#90caf9;background:linear-gradient(90deg,rgba(25,118,210,.05),var(--card))}
.att-row .a-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#1a237e,#3949ab)}
.att-row .a-info{flex:1;min-width:0}
.att-row .a-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-row .a-phone{font-size:10.5px;color:var(--text-muted);margin-top:2px;direction:ltr;text-align:right}
.att-btns{display:flex;gap:4px;flex-shrink:0}
.att-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.att-btn.active.present{background:linear-gradient(135deg,#2e7d32,#43a047);border-color:#2e7d32;color:#fff}
.att-btn.active.absent{background:linear-gradient(135deg,#c62828,#e53935);border-color:#c62828;color:#fff}
.att-btn.active.late{background:linear-gradient(135deg,#ef6c00,#f57c00);border-color:#ef6c00;color:#fff}
.att-btn.active.leave{background:linear-gradient(135deg,#1565c0,#1976d2);border-color:#1565c0;color:#fff}

/* ========================================================

   ======================================================== */
.report-card-container { background: transparent; padding: 10px; }

/* 🎯 حالت نمایش در صفحه گوشی (ریسپانسیو) */
.page { 
    background: #fff; 
    width: 100%; 
    max-width: 210mm;
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    margin: 0 auto 20px auto; 
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    padding: 15px;
}

/* تنظیم فونت‌ها برای نمایش در گوشی */
.page .rc-header { border-bottom: 2px solid #1a237e; padding-bottom: 8px; margin-bottom: 10px; text-align: center; }
.page .rc-header h2 { font-size: 15px; color: #1a237e; margin-bottom: 4px; }
.page .rc-header p { font-size: 11px; color: #6b7890; font-weight: 600; }
.page .rc-profile { display: flex; gap: 15px; margin-bottom: 10px; }
.page .rc-info { flex: 1; display: grid; grid-template-columns: 1fr 1fr; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e3e9f2; gap: 6px 15px; align-content: start; }
.page .rc-info-item { display: flex; align-items: center; font-size: 11px; }
.page .rc-info-label { font-weight: 700; color: #1a2233; margin-left: 6px; white-space: nowrap; }
.page .rc-info-value { color: #4a5568; }
.page .rc-photo { width: 55px; height: 70px; border: 1.5px solid #94a3b8; border-radius: 6px; background: #fff; flex-shrink: 0; }
.page table.rc-table { width: 100%; border-collapse: collapse; text-align: center; margin-bottom: 10px; }
.page .rc-table th, .page .rc-table td { border: 1px solid #cbd5e1; padding: 5px 2px; font-size: 10px; }
.page .rc-table th { background: #e2e8f0; color: #1a237e; font-weight: 800; }
.page .rc-table .sub-name { text-align: center; font-weight: 700; font-size: 11px; }
.page .rc-table .teacher-name { font-size: 9.5px; color: #4a5568; }
.page .rc-table .row-odd { background: #f8fafc; }
.page .rc-table .row-even { background: #fff; }
.page .rc-table .conduct-row { background: #e8f5e9; color: #2e7d32; font-weight: 800; }
.page .rc-summary { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid #1a237e; padding: 8px 15px; border-radius: 6px; margin-top: 5px; }
.page .rc-summary-title { font-size: 12px; font-weight: 800; color: #1a237e; }
.page .rc-summary-value { font-size: 16px; font-weight: 900; color: #2e7d32; direction: ltr; }

/* ========================================================
   🎯 تنظیمات چاپ (فقط موقع دانلود PDF برای A5)
   ======================================================== */
@media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
    .btn, .admin-panel, .no-print, .tab-bar, .app-header, .sub-tabs, select, .report-header { display: none !important; }
    
    .container { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
    .report-card-container { padding: 0 !important; box-shadow: none !important; }
    
    #printOverlay { display: block !important; position: static !important; background: none !important; padding: 0 !important; overflow: visible !important; }
    #printOverlay > div { max-width: 100% !important; margin: 0 !important; }
    #print-area { display: block !important; gap: 0 !important; }
    
    /* ابعاد دقیق A5 برای چاپ */
    .page { 
        width: 100% !important;
        height: 148mm !important; /* دقیقاً نصف A4 */
        padding: 5mm 10mm 5mm 10mm !important; 
        margin: 0 auto !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
        page-break-inside: avoid !important;
        page-break-after: auto !important;
    }

    /* ریز کردن فونت‌ها برای جا شدن در A5 */
    .page .rc-header { padding-bottom: 4px !important; margin-bottom: 6px !important; border-bottom: 1.5px solid #1a237e !important; }
    .page .rc-header h2 { font-size: 13px !important; }
    .page .rc-header p { font-size: 9px !important; }
    .page .rc-profile { gap: 10px !important; margin-bottom: 6px !important; }
    .page .rc-info { padding: 5px 8px !important; gap: 2px 10px !important; }
    .page .rc-info-item { font-size: 9.5px !important; }
    .page .rc-photo { width: 45px !important; height: 60px !important; }
    .page .rc-table th, .page .rc-table td { font-size: 8.5px !important; padding: 1px 2px !important; }
    .page .rc-table .sub-name { font-size: 9.5px !important; }
    .page .rc-table .teacher-name { font-size: 8.5px !important; }
    .page .rc-summary { padding: 3px 10px !important; margin-top: 4px !important; margin-bottom: 6px !important; }
    .page .rc-summary-title { font-size: 10px !important; }
    .page .rc-summary-value { font-size: 14px !important; }
    
    /* مخفی کردن کادر امضا برای دانش‌آموز (چون A5 است) */
    .rc-signatures { display: none !important; }
}
}

function checkLogin(){
  const name=localStorage.getItem('user_name'),role=localStorage.getItem('user_role');
  if(!name||!role){window.location.href='login.html';return false}
  currentUser={name,role,
    nationalId:localStorage.getItem('user_nationalId')||'',
    gradeCode:localStorage.getItem('student_gradeCode')||'',
    gradeName:localStorage.getItem('student_gradeName')||'',
    subject:localStorage.getItem('teacher_subject')||'',
    classes:JSON.parse(localStorage.getItem('teacher_classes')||'[]')};
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userAvatar').textContent=currentUser.name.charAt(0);
  const roleLabel={ 'دانش‌آموز':'🎓 دانش‌آموز','دبیر':'👨‍🏫 دبیر','مدیر':'👨‍💼 مدیر','معاون':'👨‍💼 معاون'};
  document.getElementById('userRole').textContent=roleLabel[role]||role;
  if(role==='دانش‌آموز')document.getElementById('headerSub').textContent=currentUser.gradeName;
  else if(role==='دبیر')document.getElementById('headerSub').textContent=currentUser.subject;
  else document.getElementById('headerSub').textContent='مدیریت مدرسه';
  return true;
}

  localStorage.clear();
  window.location.href='login.html';
}

async function buildTabs(){
  let showGradesToStudent = false;
  try {
    const r = await fetch(API_URL+'?action=getSettings&t='+Date.now());
    const res = await r.json();
    if (res.success && res.data) {
      showGradesToStudent = (res.data.show_grades_to_student === 'true' || String(res.data.show_grades_to_student).toLowerCase() === 'true');
    }
  } catch(e) {}

  const role=currentUser.role;let tabs=[];
  if(role==='دانش‌آموز'){
    tabs=[{id:'home',icon:'🏠',label:'خانه'},{id:'schedule',icon:'📅',label:'برنامه'},{id:'exams',icon:'📝',label:'امتحانات'},{id:'homework',icon:'📚',label:'تکالیف'},{id:'chat',icon:'💬',label:'چت'},{id:'news',icon:'📢',label:'اطلاعیه'},{id:'feedback',icon:'✍️',label:'انتقادات'}];
    if(showGradesToStudent){
      tabs.splice(3, 0, {id:'myReportCard',icon:'📊',label:'کارنامه من'});
    }
  }else if(role==='دبیر'){
    tabs=[{id:'home',icon:'🏠',label:'خانه'},{id:'myClasses',icon:'🎓',label:'کلاس‌ها'},{id:'attendance',icon:'✅',label:'حضور و غیاب'},{id:'grades',icon:'📝',label:'ثبت نمرات'},{id:'addExam',icon:'➕',label:'ثبت امتحان'},{id:'addHomework',icon:'📚',label:'ثبت تکلیف'},{id:'myHomework',icon:'📖',label:'تکالیف'},{id:'chat',icon:'💬',label:'چت'},{id:'news',icon:'📢',label:'اطلاعیه'}];
  }else{
    tabs=[{id:'home',icon:'🏠',label:'خانه'},{id:'attendance',icon:'✅',label:'حضور و غیاب'},{id:'attReport',icon:'📊',label:'گزارش غیبت'},{id:'contactLogs',icon:'📞',label:'گزارش تماس'},{id:'certificates',icon:'🏆',label:'تقدیرنامه‌ها'},{id:'manageGrades',icon:'📈',label:'مدیریت نمرات'},{id:'adminGradeEntry',icon:'✏️',label:'ورود نمرات'},{id:'sendNews',icon:'📢',label:'اطلاعیه'},{id:'manageNews',icon:'📰',label:'مدیریت'},{id:'manageFeedback',icon:'✍️',label:'انتقادات'},{id:'addExam',icon:'➕',label:'ثبت امتحان'},{id:'myExams',icon:'📋',label:'امتحانات'},{id:'myHomework',icon:'📖',label:'تکالیف'},{id:'chat',icon:'💬',label:'چت'}];
  }
  
  const tabBar=document.getElementById('tabBar');tabBar.innerHTML='';
  tabs.forEach((tab,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.dataset.tab=tab.id;
    btn.onclick=()=>switchTab(tab.id,btn);
    btn.innerHTML='<span class="tab-icon">'+tab.icon+'</span><span>'+esc(tab.label)+'</span><span class="tab-badge" id="badge-'+tab.id+'"></span>';
    tabBar.appendChild(btn);
  });
  const c=document.getElementById('tabContent');c.innerHTML='';
  tabs.forEach(tab=>{const d=document.createElement('div');d.className='tab-content';d.id='tab-'+tab.id;c.appendChild(d)});
  if(tabs.length>0)switchTab(tabs[0].id,tabBar.querySelector('.tab-btn'));
  startUnreadPolling();
}
function startUnreadPolling(){
  if(unreadPollingTimer)clearInterval(unreadPollingTimer);
  updateUnreadBadges();
  unreadPollingTimer=setInterval(updateUnreadBadges,20000);
}

async function updateUnreadBadges(){
  try{
    const url=API_URL+'?action=getChatList'
      +'&role='+encodeURIComponent(currentUser.role)
      +'&nationalId='+encodeURIComponent(currentUser.nationalId)
      +'&gradeCode='+encodeURIComponent(currentUser.gradeCode||'')
      +'&classes='+encodeURIComponent(currentUser.classes.join(','))
      +'&name='+encodeURIComponent(currentUser.name)
      +'&t='+Date.now();
    const r=await fetch(url);
    const result=await r.json();
    if(!result.success||!result.data)return;
    const muted=getMutedChats();
    let total=0;
    result.data.forEach(c=>{
      if(muted.indexOf(c.id)>-1)return;
      if(c.type==='saved')return;
      if(c.unread) total+=c.unread;
    });
    const badge=document.getElementById('badge-chat');
    if(badge){
      if(total>0){badge.textContent=total>99?'99+':total;badge.classList.add('visible')}
      else{badge.classList.remove('visible')}
    }
  }catch(e){}
}

function getTodayPersian(){
  try{
    const d=new Date();
    const gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
    const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
    let jy=(gy<=1600)?0:979;
    let y=(gy<=1600)?gy:gy-1600;
    const gy2=(gm>2)?(y+1):y;
    let days=(365*y)+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
    jy+=33*parseInt(days/12053);days%=12053;
    jy+=4*parseInt(days/1461);days%=1461;
    if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
    const jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
    const jd=1+((days<186)?(days%31):((days-186)%30));
    return jy+'/'+(jm<10?'0':'')+jm+'/'+(jd<10?'0':'')+jd;
  }catch(e){return ''}
}

  const rows=document.querySelectorAll('#attendanceListContainer .att-row');
  const row=rows[idx];if(!row)return;
  row.classList.remove('absent','late','leave');
  if(status==='غایب')row.classList.add('absent');
  else if(status==='تاخیر')row.classList.add('late');
  else if(status==='مرخصی')row.classList.add('leave');
  row.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('active'));
  const btnClass=status==='حاضر'?'present':(status==='غایب'?'absent':(status==='تاخیر'?'late':'leave'));
  const btn=row.querySelector('.att-btn.'+btnClass);
  if(btn)btn.classList.add('active');
}
function setAttNote(idx,val){attendanceData[idx].note=val;}

async function saveAttendance(){
  const btn=document.getElementById('saveAttBtn');
  const withStatus=attendanceData.filter(s=>s.status);
  if(withStatus.length===0){showToast('⚠️ ابتدا وضعیت حداقل یه نفر رو مشخص کن');return}
  const unset=attendanceData.filter(s=>!s.status).length;
  if(unset>0){
    if(!confirm('برای '+toFa(unset)+' نفر وضعیت انتخاب نشده. اون‌ها به عنوان «حاضر» ثبت شن؟'))return;
    attendanceData.forEach(s=>{if(!s.status)s.status='حاضر'});
  }
  btn.disabled=true;btn.innerHTML='<span>⏳</span><span>در حال ذخیره...</span>';
  try{
    const payload={
      gradeCode:attendanceClass,
      date:attendanceDate,
      teacherName:currentUser.name,
      role:currentUser.role,
      records:JSON.stringify(attendanceData.map(s=>({nationalId:s.nationalId,name:s.name,status:s.status,note:s.note||''})))
    };
    const params=new URLSearchParams();
    params.append('action','saveAttendance');
    for(const k in payload)params.append(k,payload[k]);
    const r=await fetch(API_URL,{method:'POST',body:params});
    const result=await r.json();
    if(result.success){
      showToast('✅ ذخیره شد ('+toFa(result.saved+result.updated)+' رکورد)');
      await loadAttendanceList();
    }else showToast('❌ '+(result.message||'خطا'));
  }catch(err){showToast('❌ خطا در ارتباط')}
  btn.disabled=false;btn.innerHTML='<span>💾</span><span>ذخیره حضور و غیاب</span>';
}

function downloadExcel(){
  if(!reportData||reportData.length===0){showToast('⚠️ داده‌ای برای دانلود نیست');return}
  let filtered=reportData;
  if(reportFilter==='absent')filtered=filtered.filter(x=>x.status==='غایب');
  else if(reportFilter==='late')filtered=filtered.filter(x=>x.status==='تاخیر');
  else if(reportFilter==='leave')filtered=filtered.filter(x=>x.status==='مرخصی');
  else if(reportFilter==='present')filtered=filtered.filter(x=>x.status==='حاضر');
  const data=filtered.map(r=>({
    'تاریخ':String(r.date||''),
    'کلاس':String(r.gradeName||''),
    'نام دانش‌آموز':String(r.name||''),
    'کد ملی':String(r.nationalId||''),
    'شماره تماس':String(r.phone||''),
    'وضعیت':String(r.status||''),
    'ثبت‌کننده':String(r.teacher||''),
    'ساعت ثبت':String(r.time||''),
    'توضیحات':String(r.note||'')
  }));
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(data);
    const range=XLSX.utils.decode_range(ws['!ref']);
    for(let R=0;R<=range.e.r;R++){
      for(let C=0;C<=range.e.c;C++){
        const addr=XLSX.utils.encode_cell({r:R,c:C});
        const cell=ws[addr];
        if(cell){cell.t='s';cell.z='@';if(cell.v!=null)cell.v=String(cell.v);}
      }
    }
    ws['!cols']=[{wch:12},{wch:14},{wch:20},{wch:14},{wch:14},{wch:10},{wch:18},{wch:10},{wch:25}];
    XLSX.utils.book_append_sheet(wb,ws,'حضور و غیاب');
    const className = (reportClassFilter==='all') ? 'کل مدرسه' : getGradeName(reportClassFilter);
    const dateName = (reportDateFilter || getTodayPersian()).replace(/\//g,'-');
    const fileName = className + ' - ' + dateName + '.xlsx';
    XLSX.writeFile(wb,fileName);
    showToast('✅ فایل دانلود شد');
  }catch(err){console.error(err);showToast('❌ خطا در ساخت فایل')}
}

function isJalaliLeap(jy){
  var m=jy%33;
  return m===1||m===5||m===9||m===13||m===17||m===22||m===26||m===30;
}
function getJalaliMonthDays(jy,jm){
  if(jm<=6)return 31;
  if(jm<=11)return 30;
  return isJalaliLeap(jy)?30:29;
}
function jalaliToGregorian(jy,jm,jd){
  jy=parseInt(jy);jm=parseInt(jm);jd=parseInt(jd);
  var jy2=jy-979;
  var days=365*jy2+Math.floor(jy2/33)*8+Math.floor(((jy2%33)+3)/4);
  var jm_days=[0,31,31,31,31,31,31,30,30,30,30,30,29];
  for(var i=1;i<jm;i++)days+=jm_days[i];
  days+=jd-1;
  days+=79;
  var gy=1600+400*Math.floor(days/146097);days%=146097;
  var leap=true;
  if(days>=36525){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++;else leap=false;}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>=366){leap=false;days--;gy+=Math.floor(days/365);days%=365;}
  var gd=[0,31,28,31,30,31,30,31,31,30,31,30,31];
  if(leap)gd[2]=29;
  var gm;for(gm=1;gm<=12;gm++){if(days<gd[gm])break;days-=gd[gm];}
  return {gy:gy,gm:gm,gd:days+1};
}
function jalaliWeekdayCol(jy,jm,jd){
  var g=jalaliToGregorian(jy,jm,jd);
  var d=new Date(g.gy,g.gm-1,g.gd);
  return (d.getDay()+1)%7;
}
let _dpState={jy:0,jm:0,jd:0,onSelect:null,popup:null};
function openJalaliPicker(inputEl,onSelect){
  closeJalaliPicker();
  var val=(inputEl.value||'').trim();
  var today=getTodayPersian().split('/');
  var jy=parseInt(today[0]),jm=parseInt(today[1]),jd=parseInt(today[2]);
  if(val){
    var parts=normalizeNumbersLocal(val).split('/');
    if(parts.length===3){
      var py=parseInt(parts[0]),pm=parseInt(parts[1]),pd=parseInt(parts[2]);
      if(py>1300&&py<1500&&pm>=1&&pm<=12){jy=py;jm=pm;jd=pd;}
    }
  }
  _dpState.jy=jy;_dpState.jm=jm;_dpState.jd=jd;_dpState.onSelect=onSelect;
  var popup=document.createElement('div');
  popup.className='date-picker-popup';
  popup.onclick=function(e){e.stopPropagation()};
  var wrap=inputEl.closest('.date-picker-wrap')||inputEl.parentElement;
  wrap.style.position='relative';
  wrap.appendChild(popup);
  _dpState.popup=popup;
  renderJalaliPicker();
  setTimeout(function(){document.addEventListener('click',_closeDpOutside)},10);
}
function _closeDpOutside(e){
  if(_dpState.popup&&!_dpState.popup.contains(e.target))closeJalaliPicker();
}
function closeJalaliPicker(){
  document.removeEventListener('click',_closeDpOutside);
  if(_dpState.popup){try{_dpState.popup.remove()}catch(e){}}
  _dpState.popup=null;
}
function renderJalaliPicker(){
  if(!_dpState.popup)return;
  var jy=_dpState.jy,jm=_dpState.jm,jd=_dpState.jd;
  var monthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var days=getJalaliMonthDays(jy,jm);
  var startCol=jalaliWeekdayCol(jy,jm,1);
  var h='';
  h+='<div class="dp-header"><div class="dp-month-year">'+monthNames[jm-1]+' '+toFa(jy)+'</div><div class="dp-nav"><button onclick="dpPrevMonth()">‹</button><button onclick="dpNextMonth()">›</button></div></div>';
  h+='<div class="dp-grid">';
  ['ش','ی','د','س','چ','پ','ج'].forEach(function(d){h+='<div class="dp-day-head">'+d+'</div>'});
  for(var i=0;i<startCol;i++)h+='<div class="dp-day empty"></div>';
  var todayJ=getTodayPersian().split('/');
  var tY=parseInt(todayJ[0]),tM=parseInt(todayJ[1]),tD=parseInt(todayJ[2]);
  for(var d=1;d<=days;d++){
    var cls='dp-day';
    if(jy===tY&&jm===tM&&d===tD)cls+=' today';
    if(d===jd)cls+=' selected';
    h+='<button class="'+cls+'" onclick="dpSelectDay('+d+')">'+toFa(d)+'</button>';
  }
  h+='</div>';
  h+='<button class="dp-close" onclick="closeJalaliPicker()">بستن</button>';
  _dpState.popup.innerHTML=h;
}
function dpPrevMonth(){
  _dpState.jm--;
  if(_dpState.jm<1){_dpState.jm=12;_dpState.jy--;}
  renderJalaliPicker();
}
function dpNextMonth(){
  _dpState.jm++;
  if(_dpState.jm>12){_dpState.jm=1;_dpState.jy++;}
  renderJalaliPicker();
}
function dpSelectDay(d){
  _dpState.jd=d;
  var jy=_dpState.jy,jm=_dpState.jm;
  var val=jy+'/'+(jm<10?'0':'')+jm+'/'+(d<10?'0':'')+d;
  if(_dpState.onSelect)_dpState.onSelect(val);
  closeJalaliPicker();
}

function loadSchedule(){
  const el=document.getElementById('tab-schedule');if(!el)return;
  const data=SCHEDULE_DATA[currentUser.gradeCode];
  if(!data){el.innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">کلاس شما مشخص نیست</div></div>';return}
  const todayIdx=getTodayIndex();let html='';
  data.days.forEach((day,idx)=>{
    html+='<div class="day-block'+(idx===todayIdx?' highlight':'')+'"><div class="day-title">📅 '+esc(day.day);
    if(idx===todayIdx)html+='<span class="today-badge">امروز</span>';
    html+='</div>';
    day.lessons.forEach((lesson,i)=>{
      if(!lesson){html+='<div class="lesson-row empty"><span class="z-num">'+toFa(i+1)+'</span><div class="lesson-content"><span class="lesson-name">—</span></div></div>'}
      else{const isRot=lesson[2]===true;html+='<div class="lesson-row'+(isRot?' rot':'')+'"><span class="z-num">'+toFa(i+1)+'</span><div class="lesson-content"><div class="lesson-name">'+esc(lesson[0])+'</div>'+(isRot?'<div class="teacher-name">'+esc(lesson[1])+'</div>':'<div class="teacher-name">آقای '+esc(lesson[1])+'</div>')+'</div></div>'}
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

async function loadStudentExams(){
  const el=document.getElementById('tab-exams');if(!el)return;
  el.innerHTML='<div class="sub-tabs"><button class="sub-tab active" onclick="renderExamList(\'ترم\',this)">📋 امتحانات ترم</button><button class="sub-tab" onclick="renderExamList(\'کلاسی\',this)">📝 امتحانات کلاسی</button></div><div id="examList"></div>';
  renderExamList('ترم');
}
async function renderExamList(type,btn){
  if(btn){document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active')}
  const el=document.getElementById('examList');if(!el)return;
  el.innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
  try{
    const r=await fetch(API_URL+'?action=getExams&type='+encodeURIComponent(type)+'&grade='+currentUser.gradeCode+'&t='+Date.now());
    const result=await r.json();
    if(!result.success||!result.data||result.data.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">امتحانی نیست</div></div>';return}
    el.innerHTML=result.data.map(exam=>renderExamCard(exam,false)).join('');
  }catch(err){el.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطا</div></div>'}
}
function renderExamCard(exam,canDelete){
  const type=exam['نوع']||'کلاسی';const tc=type==='ترم'?'term':'class-exam';const tl=type==='ترم'?'📋 ترم':'📝 کلاسی';
  let h='<div class="exam-card '+tc+'"><div class="exam-card-header"><div class="exam-card-title">'+esc(exam['عنوان']||exam['درس']||'امتحان')+'</div><span class="exam-card-type '+tc+'">'+tl+'</span></div><div class="exam-card-info">';
  if(exam['درس'])h+='<span class="exam-info-item">📚 '+esc(exam['درس'])+'</span>';
  if(exam['پایه'])h+='<span class="exam-info-item">🎓 '+esc(getGradeName(exam['پایه']))+'</span>';
  if(exam['تاریخ'])h+='<span class="exam-info-item">📅 '+esc(exam['تاریخ'])+'</span>';
  if(exam['ساعت'])h+='<span class="exam-info-item">🕐 '+esc(toFa(exam['ساعت']))+'</span>';
  if(exam['معلم'])h+='<span class="exam-info-item">👨‍🏫 '+esc(exam['معلم'])+'</span>';
  if(exam['محل'])h+='<span class="exam-info-item">📍 '+esc(exam['محل'])+'</span>';
  h+='</div>';
  if(exam['توضیحات'])h+='<div class="exam-card-desc">📝 '+esc(exam['توضیحات'])+'</div>';
  if(canDelete)h+='<div class="exam-card-actions"><button class="exam-action-btn danger" onclick="deleteExam('+exam._rowIndex+')">🗑️ حذف</button></div>';
  h+='</div>';return h;
}

async function renderMyExamList(type,btn){
  if(btn){document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active')}
  const el=document.getElementById('myExamList');if(!el)return;
  el.innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
  try{
    const r=await fetch(API_URL+'?action=getExams&type='+encodeURIComponent(type)+'&t='+Date.now());
    const result=await r.json();
    if(!result.success||!result.data||result.data.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">امتحانی نیست</div></div>';return}
    const isM=currentUser.role==='مدیر'||currentUser.role==='معاون';
    const filtered=isM?result.data:result.data.filter(e=>normalizeTextLocal(e['معلم'])===normalizeTextLocal(currentUser.name));
    if(filtered.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">شما امتحانی ندارید</div></div>';return}
    el.innerHTML=filtered.map(exam=>renderExamCard(exam,true)).join('');
  }catch(err){el.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطا</div></div>'}
}
async function deleteExam(idx){
  if(!confirm('حذف شود؟'))return;
  try{
    const r=await fetch(API_URL+'?action=deleteExam&rowIndex='+idx+'&userRole='+encodeURIComponent(currentUser.role)+'&teacher='+encodeURIComponent(currentUser.name)+'&t='+Date.now());
    const result=await r.json();
    if(result.success){showToast('✅ حذف شد');loadMyExams()}
  }catch(err){showToast('❌ خطا')}
}

async function submitExam(){
  const btn=document.getElementById('examSubmitBtn');
  const type=document.getElementById('examType').value,title=document.getElementById('examTitle').value.trim(),grade=document.getElementById('examGrade').value,subject=document.getElementById('examSubject').value.trim(),date=document.getElementById('examDate').value.trim(),time=document.getElementById('examTime').value.trim(),location=document.getElementById('examLocation').value.trim(),desc=document.getElementById('examDesc').value.trim();
  if(!title||!subject||!date||!time){showToast('⚠️ فیلدها را پر کن');return}
  btn.disabled=true;btn.textContent='...';
  try{
    const r=await fetch(API_URL+'?action=addExam&type='+encodeURIComponent(type)+'&title='+encodeURIComponent(title)+'&grade='+encodeURIComponent(grade)+'&subject='+encodeURIComponent(subject)+'&teacher='+encodeURIComponent(currentUser.name)+'&date='+encodeURIComponent(date)+'&time='+encodeURIComponent(time)+'&location='+encodeURIComponent(location)+'&description='+encodeURIComponent(desc)+'&userRole='+encodeURIComponent(currentUser.role)+'&userClasses='+encodeURIComponent(currentUser.classes.join(','))+'&t='+Date.now());
    const result=await r.json();
    if(result.success){showToast('✅ ثبت شد');['examTitle','examDate','examTime','examLocation','examDesc'].forEach(id=>document.getElementById(id).value='')}
  }catch(err){showToast('❌ خطا')}
  btn.disabled=false;btn.textContent='📤 ثبت';
}

async function loadStudentHomework(){
  const el=document.getElementById('tab-homework');if(!el)return;
  el.innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
  try{
    const [hwR,stR]=await Promise.all([
      fetch(API_URL+'?action=getHomework&grade='+currentUser.gradeCode+'&t='+Date.now()).then(r=>r.json()),
      fetch(API_URL+'?action=getHomeworkStatus&nationalId='+currentUser.nationalId+'&t='+Date.now()).then(r=>r.json())
    ]);
    hwStatusCache={};
    if(stR.success&&stR.data)stR.data.forEach(s=>{const id=String(s['شماره تکلیف']||'').trim();hwStatusCache[id]={status:String(s['وضعیت']||'').trim(),fileUrl:s['لینک فایل']||'',fileName:s['نام فایل']||''}});
    if(!hwR.success||!hwR.data||hwR.data.length===0){el.innerHTML='<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-title">تکلیفی نیست</div></div>';return}
    el.innerHTML=hwR.data.map(hw=>renderHomeworkCardStudent(hw)).join('');
  }catch(err){el.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">خطا</div></div>'}
}
function renderHomeworkCardStudent(hw){
  const id=String(hw['شماره']||'').trim();
  const st=hwStatusCache[id]||{};
  const isDone=st.status==='انجام شد';
  const endDate=String(hw['تاریخ پایان']||hw['مهلت']||'').trim();
  const endTime=String(hw['ساعت پایان']||'').trim();
  const startDate=String(hw['تاریخ شروع']||'').trim();
  const startTime=String(hw['ساعت شروع']||'').trim();
  const tl=getTimeLeft(endDate,endTime);
  const expired=tl.expired;
  let cc='hw-card';if(isDone)cc+=' done';
  let badge=isDone?'<span class="hw-status-badge done">✅ انجام شد</span>':'<span class="hw-status-badge pending">⏳ در انتظار</span>';
  let h='<div class="'+cc+'"><div class="hw-card-header"><div class="hw-card-title">📚 '+esc(hw['عنوان']||'تکلیف')+'</div>'+badge+'</div><div class="hw-card-info">';
  if(hw['دبیر'])h+='<span class="hw-info-item">👨‍🏫 '+esc(hw['دبیر'])+'</span>';
  if(startDate)h+='<span class="hw-info-item">📅 از '+esc(startDate)+(startTime?' '+esc(startTime):'')+'</span>';
  if(endDate)h+='<span class="hw-info-item">📅 تا '+esc(endDate)+(endTime?' '+esc(endTime):'')+'</span>';
  h+='</div>';
  if(hw['توضیح'])h+='<div class="hw-card-desc">📝 '+esc(hw['توضیح'])+'</div>';
  if(tl.text){
    const cls=tl.expired?'expired':((tl.ms||0)<86400000?'warn':'ok');
    h+='<div class="hw-deadline-badge '+cls+'">⏱ '+esc(tl.text)+'</div>';
  }
  // 🖼️ نمایش فایل ارسالی با پیش‌نمایش
  if(st.fileUrl){
    h+='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">';
    h+='<div style="font-size:11.5px;color:var(--text-soft);margin-bottom:6px;font-weight:700">📤 فایل ارسالی شما:</div>';
    h+=renderFilePreview(st.fileUrl,st.fileName||'');
    h+='</div>';
  }
  if(expired&&!isDone){
    h+='<div style="padding:10px;text-align:center;background:#ffebee;color:#c62828;border-radius:10px;font-size:12px;font-weight:700;margin-top:8px">⛔ مهلت این تکلیف به پایان رسیده</div>';
  } else {
    h+='<button class="hw-upload-btn" onclick="pickFileForHomework(\''+escAttr(id)+'\')">📎 '+(st.fileUrl?'تغییر فایل':'ارسال فایل')+'</button>';
  }
  if(isDone)h+='<button class="hw-mark-btn done" onclick="toggleHomeworkStatus(\''+escAttr(id)+'\',\'در انتظار\')">✅ انجام شد (لغو)</button>';
  else if(!expired)h+='<button class="hw-mark-btn" onclick="toggleHomeworkStatus(\''+escAttr(id)+'\',\'انجام شد\')">✋ علامت‌گذاری</button>';
  h+='</div>';return h;
}

// پیش‌نمایش فایل (مشترک بین دبیر و دانش‌آموز)
// ============================================================
function renderFilePreview(fileUrl, fileName){
  if(!fileUrl) return '';
  const ext=(fileName||'').split('.').pop().toLowerCase();
  const driveId=(fileUrl.match(/[-\w]{25,}/)||[])[0]||'';
  const imageExts=['jpg','jpeg','png','gif','webp','bmp','heic','heif','jfif','avif'];
  const audioExts=['webm','m4a','mp3','wav','ogg','aac','opus'];
  const videoExts=['mp4','webm','mov','avi','mkv','m4v'];
  let h='<div class="hw-file-grid">';
  if(driveId&&imageExts.indexOf(ext)>-1){
    const imgUrl='https://lh3.googleusercontent.com/d/'+driveId;
    h+='<div class="hw-file-item"><img class="hw-file-img" src="'+escAttr(imgUrl)+'" onclick="openImageViewer(\''+escAttr(imgUrl)+'\')" loading="lazy" alt=""></div>';
  } else if(driveId&&audioExts.indexOf(ext)>-1){
    h+='<div class="hw-file-item"><div class="hw-file-audio"><button class="voice-play-btn" onclick="playVoiceMessage(\''+escAttr(driveId)+'\',this)"><span class="vp-icon">▶️</span><span class="vp-text">پیام صوتی</span></button><audio controls preload="none" style="display:none"></audio></div></div>';
  } else if(driveId&&videoExts.indexOf(ext)>-1){
    h+='<div class="hw-file-item"><div class="hw-file-video" onclick="openVideoPlayer(\''+escAttr(driveId)+'\')"><div class="ic">▶</div><div class="lbl">🎬 ویدیو</div></div></div>';
  } else {
    h+='<div class="hw-file-item"><a class="hw-file-doc" href="'+escAttr(fileUrl)+'" target="_blank">📄 '+esc(fileName||'دانلود')+'</a></div>';
  }
  h+='</div>';
  return h;
}
async function toggleHomeworkStatus(hwId,status){
  try{
    const r=await fetch(API_URL+'?action=markHomework&homeworkId='+encodeURIComponent(hwId)+'&nationalId='+currentUser.nationalId+'&status='+encodeURIComponent(status)+'&t='+Date.now());
    const result=await r.json();
    if(result.success){showToast(status==='انجام شد'?'✅ ثبت شد':'⏳ لغو شد');loadStudentHomework()}
  }catch(err){showToast('❌ خطا')}
}
function pickFileForHomework(hwId){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*,.pdf,.doc,.docx,.txt,.zip';

  if(window._hwMode==='range'){
    startDate=document.getElementById('hwStartDate').value.trim();

    endDate=gregorianToJalaliLocal(ed);

}
function gregorianToJalaliLocal(d){
  var gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+parseInt((gy2+3)/4)-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053);days%=12053;
  jy+=4*parseInt(days/1461);days%=1461;
  if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365;}
  var jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return jy+'/'+(jm<10?'0':'')+jm+'/'+(jd<10?'0':'')+jd;
}
function getTimeLeft(endDate,endTime){
  try{
    if(!endDate)return{expired:false,text:''};
    const parts=endDate.split('/');
    const g=jalaliToGregorian(parseInt(parts[0]),parseInt(parts[1]),parseInt(parts[2]));
    const t=(endTime||'23:59').split(':');
    const end=new Date(g.gy,g.gm-1,g.gd,parseInt(t[0])||23,parseInt(t[1])||59);
    const now=new Date();
    const diff=end-now;
    if(diff<0)return{expired:true,text:'مهلت تمام شده'};
    const days=Math.floor(diff/86400000);
    const hours=Math.floor((diff%86400000)/3600000);
    const mins=Math.floor((diff%3600000)/60000);
    let text='';
    if(days>0)text=toFa(days)+' روز و '+toFa(hours)+' ساعت مانده';
    else if(hours>0)text=toFa(hours)+' ساعت و '+toFa(mins)+' دقیقه مانده';
    else text=toFa(mins)+' دقیقه مانده';
    return{expired:false,text:text,ms:diff};
  }catch(e){return{expired:false,text:''};}
}

function updateHomeworkBadge(){
  if(!window._hwCounts)return;
  let totalDone=0;
  const seen=JSON.parse(localStorage.getItem('hw_seen')||'{}');
  for(const id in window._hwCounts){
    const done=window._hwCounts[id].done||0;
    const lastSeen=seen[id]||0;
    if(done>lastSeen)totalDone+=(done-lastSeen);
  }
  const badge=document.getElementById('badge-myHomework');
  if(badge){
    if(totalDone>0){badge.textContent=totalDone>99?'99+':totalDone;badge.classList.add('visible');}
    else badge.classList.remove('visible');
  }
}

function getMutedChats(){
  try{return JSON.parse(localStorage.getItem('muted_chats')||'[]')}catch(e){return[]}
}
function isChatMuted(chatId){
  return getMutedChats().indexOf(chatId)>-1;
}
function toggleMuteChat(){
  if(!currentChatId)return;
  let muted=getMutedChats();
  const idx=muted.indexOf(currentChatId);
  if(idx>-1){muted.splice(idx,1);showToast('🔔 صدا فعال شد')}
  else{muted.push(currentChatId);showToast('🔕 چت بی‌صدا شد')}
  localStorage.setItem('muted_chats',JSON.stringify(muted));
  updateMuteButton();
  updateUnreadBadges();
}
function updateMuteButton(){
  const btn=document.getElementById('muteChatBtn');
  if(!btn)return;
  const muted=isChatMuted(currentChatId);
  btn.textContent=muted?'🔕':'🔔';
  btn.title=muted?'فعال کردن صدا':'بی‌صدا کردن';
}

function formatChatTime(t){
  try{
    if(!t)return '';
    const d=new Date(t);if(isNaN(d.getTime()))return '';
    const today=new Date();
    if(d.toDateString()===today.toDateString())return d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'});
  }catch(e){return ''}
}

async function openChatRoom(chatId,chatName,type){
  currentChatId=chatId;currentChatName=chatName;currentChatType=type;
  replyContext=null;editContext=null;
  document.getElementById('replyPreview').classList.remove('visible');
  document.getElementById('editPreview').classList.remove('visible');
  document.getElementById('chatSearchInput').value='';
  document.getElementById('searchResults').style.display='none';
  document.getElementById('searchBarChat').classList.remove('visible');
  document.getElementById('chatListView').style.display='none';
  const room=document.getElementById('chatRoom');
  room.classList.add('active');room.dataset.theme=getChatTheme();
  document.getElementById('crTitle').textContent=chatName;
  updateMuteButton();
    // 🔒 چت سیستم فقط خواندنی است
  const inputBar = document.querySelector('.chat-input-bar');
  const micBtn = document.getElementById('micBtn');
  if (type === 'system') {
    if (inputBar) inputBar.style.display = 'none';

    if (inputBar) inputBar.style.display = 'flex';
    if (micBtn) micBtn.style.display = '';
  }
  document.getElementById('chatMessages').innerHTML='<div class="loading-spinner"><div class="spinner"></div></div>';
  await loadChatMessages();
  await markAsRead();
  if(chatPollingTimer)clearInterval(chatPollingTimer);
  chatPollingTimer=setInterval(loadChatMessages,5000);
}

function closeChatRoom(){
  if(chatPollingTimer){clearInterval(chatPollingTimer);chatPollingTimer=null}
  if(isRecording)cancelVoiceRecord();
  currentChatId='';currentChatName='';currentChatType='';
  replyContext=null;editContext=null;
  const rp=document.getElementById('replyPreview');if(rp)rp.classList.remove('visible');
  const ep=document.getElementById('editPreview');if(ep)ep.classList.remove('visible');
  const pk=document.getElementById('emojiPicker');if(pk)pk.classList.remove('visible');

}

function toggleSearchBar(){
  const sb=document.getElementById('searchBarChat');

  else{document.getElementById('chatSearchInput').value='';document.getElementById('searchResults').style.display='none';}

function closeSearchBar(){
  document.getElementById('searchBarChat').classList.remove('visible');
  document.getElementById('chatSearchInput').value='';
  document.getElementById('searchResults').style.display='none';
}

let searchTimer=null;
function handleChatSearch(q){
  clearTimeout(searchTimer);
  if(!q||!q.trim()){document.getElementById('searchResults').style.display='none';return}
  searchTimer=setTimeout(async()=>{
    try{
      const r=await fetch(API_URL+'?action=searchChatMessages&chatId='+encodeURIComponent(currentChatId)+'&query='+encodeURIComponent(q)+'&t='+Date.now());
      const result=await r.json();
      const el=document.getElementById('searchResults');
      el.style.display='block';
      if(!result.success||!result.data||result.data.length===0){el.innerHTML='<div class="search-results-empty">نتیجه‌ای پیدا نشد</div>';return}
      let h='';
      result.data.forEach(m=>{
        h+='<div class="sr-item" onclick="scrollToMessage('+m.timestamp+')"><div class="sr-sender">'+esc(m.sender)+'</div><div class="sr-text">'+esc(m.text)+'</div><div class="sr-time">'+esc(m.time)+'</div></div>';
      });
      el.innerHTML=h;
    }catch(e){}
  },400);
}

function scrollToMessage(ts){
  const rows=document.querySelectorAll('.msg-row');
  for(let i=0;i<rows.length;i++){
    if(String(rows[i].dataset.ts)===String(ts)){
      rows[i].scrollIntoView({behavior:'smooth',block:'center'});
      const bubble=rows[i].querySelector('.msg-bubble');
      if(bubble){const old=bubble.style.boxShadow;bubble.style.boxShadow='0 0 0 3px #ffb300';setTimeout(()=>bubble.style.boxShadow=old,1500)}
      break;
    }
  }
  document.getElementById('searchResults').style.display='none';
  document.getElementById('searchBarChat').classList.remove('visible');
  document.getElementById('chatSearchInput').value='';
}

      html='<div style="text-align:center;color:var(--text-muted);padding:40px 20px;font-size:12.5px">هنوز پیامی نیست</div>';

          const ext=fileName.split('.').pop().toLowerCase();
          const driveId=(m.fileUrl.match(/[-\w]{25,}/)||[])[0]||'';
          const imageExts=['jpg','jpeg','png','gif','webp','bmp','svg','heic','heif','jfif','avif','ico','tif','tiff'];
          const audioExts=['webm','m4a','mp3','wav','ogg','aac','opus','oga','weba'];

          if(driveId&&imageExts.indexOf(ext)>-1){

                'loading="lazy" alt="">'+
